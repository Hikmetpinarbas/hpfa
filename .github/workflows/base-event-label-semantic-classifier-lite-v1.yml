name: Base Event Label Semantic Classifier Lite V1

on:
  pull_request:
    paths:
      - 'docs/contracts/base_event_and_event_label_main_rule_v1.md'
      - 'base_event_label_match_test.py'
      - 'hpfa/modules/core/base_event_label_semantic_classifier_lite/**'
      - '.github/workflows/base-event-label-semantic-classifier-lite-v1.yml'
  push:
    branches:
      - base-event-label-main-rule-match-test-v1

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/base_event_label_semantic_classifier_lite/src/base_event_label_semantic_classifier.py \
            hpfa/modules/core/base_event_label_semantic_classifier_lite/tests/test_base_event_label_semantic_classifier.py \
            base_event_label_match_test.py
      - name: Focused tests
        run: pytest -q hpfa/modules/core/base_event_label_semantic_classifier_lite/tests/test_base_event_label_semantic_classifier.py
      - name: No sample match identity leak
        run: |
          if grep -RInE 'Australia|Turkey|World Cup|6935|77798' \
            hpfa/modules/core/base_event_label_semantic_classifier_lite/src \
            base_event_label_match_test.py \
            docs/contracts/base_event_and_event_label_main_rule_v1.md; then
            echo sample_identity_leak
            exit 1
          fi
