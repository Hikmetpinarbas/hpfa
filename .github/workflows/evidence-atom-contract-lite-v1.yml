name: Evidence Atom Contract Lite V1

on:
  push:
    branches: [evidence-atom-contract-lite-v1]
  pull_request:
    paths:
      - hpfa/modules/core/evidence_atom_contract_lite/**
      - .github/workflows/evidence-atom-contract-lite-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m py_compile hpfa/modules/core/evidence_atom_contract_lite/src/evidence_atom_contract.py
      - run: python -m pytest hpfa/modules/core/evidence_atom_contract_lite/tests -q
      - name: Enforce claim boundary
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          src = Path("hpfa/modules/core/evidence_atom_contract_lite/src")
          sys.path.insert(0, str(src))
          from evidence_atom_contract import build_evidence_atom_contract

          row = {
              "source_file": "Players.csv",
              "source_format": "csv",
              "source_role": "CSV_PRIMARY_CANONICAL_ACTION_SURFACE",
              "source_row_index": 1,
              "event_type_raw": "Passes accurate",
          }
          result = build_evidence_atom_contract({"rows": [row]})
          assert result["event_instance_count"] == 0
          assert result["identity_bound_atom_count"] == 0
          assert result["action_bundle_candidate_count"] == 0
          assert result["canonical_event_count"] == "UNKNOWN"
          assert result["production_release"] is False
          PY
