name: Temporary PR311 Review Fix

on:
  push:
    branches:
      - intelligence/evidence-dependency-independence-v1
    paths:
      - .github/workflows/_temporary_pr311_review_fix.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intelligence/evidence-dependency-independence-v1
          fetch-depth: 0
      - name: Install focused test dependency
        run: python -m pip install -q pytest
      - name: Apply exact review fixes
        run: python -c "import base64; exec(base64.b64decode('   lfa2V5Lml0ZW1zKCk6CiAgICAgICAgaWYgbm90IGFueShhbnkoX2JpbmRpbmdfc2lnbmF0dXJlKHJvdy   lbOjNdKSBvciByb3cuZ2V0KCJpbmRlcGVuZGVudF9zdXBwb3J0X3ZvdGUiKSBpcyBUcnVlCiAgICAgICAgICAgIGZvciByb3cgaW4gYWN0dWFsX3Jvd3MKICAgICAgICApCiAgICAgICAgbGVkZ2VyX2hhc19saW5lYWdlID0gYW55KAogICAgICAgICAgICBhbnkoX2JpbmRpbmdfc2lnbmF0dXJlKHJvdy    c2FtZSIsICJyb290X2EiLCAiZGVwX2EiLCAiaW5kX2EiKSwKICAgICAgICAgICAgICAgIGluZGVwZW5kZW50X3NpZ25hbCgi '))"
      - name: Validate focused suite
        run: |
          python -m py_compile hpfa/modules/core/composite_evidence_packet_builder_lite/src/composite_evidence_packet_builder.py
          python -m py_compile hpfa/modules/core/multi_signal_evidence_fusion_lite/src/multi_signal_evidence_fusion.py
          python -m pytest -q hpfa/modules/core/composite_evidence_packet_builder_lite/tests
          python -m pytest -q hpfa/modules/core/multi_signal_evidence_fusion_lite/tests
          python -m pytest -q hpfa/tests/integration/test_evidence_dependency_independence_v1.py hpfa/tests/integration/test_evidence_dependency_independence_review_fix_v1.py
      - name: Commit fixes to PR branch
        run: |
          git config user.name "HPFA Maintenance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hpfa/modules/core/composite_evidence_packet_builder_lite/src/composite_evidence_packet_builder.py
          git add hpfa/modules/core/multi_signal_evidence_fusion_lite/src/multi_signal_evidence_fusion.py
          git add hpfa/tests/integration/test_evidence_dependency_independence_review_fix_v1.py
          git add .github/workflows/_temporary_pr311_review_fix.yml
          git commit -m "Fix PR311 evidence independence review blockers"
          git push origin HEAD:intelligence/evidence-dependency-independence-v1
