name: Temporary PR311 Review Fix

on:
  push:
    branches:
      - intelligence/evidence-dependency-independence-v1
    paths:
      - .github/workflows/_temporary_pr311_review_fix.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intelligence/evidence-dependency-independence-v1
          fetch-depth: 0
      - name: Install focused test dependency
        run: python -m pip install -q pytest
      - name: Apply reviewed fix patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/_temporary_pr311_review_fix.yml > /tmp/previous.yml
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          text = Path('/tmp/previous.yml').read_text(encoding='utf-8')
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d > /tmp/pr311_patch.py", text)
          if not match:
              raise SystemExit('previous_patch_payload_missing')
          Path('/tmp/pr311_patch.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python /tmp/pr311_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('hpfa/tests/integration/test_evidence_dependency_independence_review_fix_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '        "claim_ceiling": "composite_candidate_only",\n        "supporting_signals": [row, dict(row)],\n'
          new = '        "claim_ceiling": "composite_candidate_only",\n        "input_windows": ["w1"],\n        "supporting_signals": [row, dict(row)],\n'
          if old not in text:
              raise SystemExit('same_lineage_fixture_pattern_missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate focused suite
        run: |
          python -m compileall -q hpfa/modules/core/composite_evidence_packet_builder_lite hpfa/modules/core/multi_signal_evidence_fusion_lite
          python -m pytest -q hpfa/tests/integration/test_evidence_dependency_independence_review_fix_v1.py hpfa/tests/integration/test_evidence_dependency_independence_review_fix_v2.py
      - name: Commit fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close PR311 dependency lineage review blockers'
          git push origin HEAD:intelligence/evidence-dependency-independence-v1
