name: Provider Time Semantic Admission V1

on:
  pull_request:
    paths:
      - 'active_match_full_run.py'
      - 'hpfa/modules/core/provider_alias_field_semantics_lite/**'
      - 'hpfa/modules/core/minimum_viable_context_lite/**'
      - 'hpfa/modules/core/event_window_builder_lite/**'
      - 'hpfa/modules/core/time_scale_router_lite/**'
      - 'hpfa/modules/core/axis_integrity_tagger_lite/**'
      - '.github/workflows/provider-time-semantic-admission-v1.yml'

permissions:
  contents: read

jobs:
  provider-time-semantic-admission:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head_sha=$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest openpyxl

      - name: Compile provider-time chain
        run: |
          python -m compileall -q \
            hpfa/modules/core/provider_alias_field_semantics_lite \
            hpfa/modules/core/minimum_viable_context_lite \
            hpfa/modules/core/event_window_builder_lite \
            hpfa/modules/core/time_scale_router_lite \
            hpfa/modules/core/axis_integrity_tagger_lite \
            active_match_full_run.py

      - name: Run provider-time admission tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/provider_alias_field_semantics_lite/tests/test_provider_time_semantic_admission.py \
            hpfa/modules/core/provider_alias_field_semantics_lite/tests/test_provider_alias_field_semantics.py

      - name: Run P0 time-chain regressions
        run: |
          python -m pytest -q \
            hpfa/modules/core/minimum_viable_context_lite/tests \
            hpfa/modules/core/event_window_builder_lite/tests \
            hpfa/modules/core/time_scale_router_lite/tests \
            hpfa/modules/core/axis_integrity_tagger_lite/tests

      - name: Provider-time policy guards
        shell: bash
        run: |
          set -euo pipefail
          P=hpfa/modules/core/provider_alias_field_semantics_lite/src/provider_time_semantic_admission.py
          grep -F 'ABSOLUTE_MATCH_SECONDS' "$P"
          grep -F 'csv_xml_start_surface_mismatch' "$P"
          grep -F 'absolute_match_time_basis_not_demonstrated' "$P"
          grep -F 'source_row_order_is_temporal_truth' "$P"
          ! grep -F 'value > 1000' "$P"
          ! grep -F 'if value >' "$P"

      - name: Claim locks
        shell: bash
        run: |
          set -euo pipefail
          P=hpfa/modules/core/provider_alias_field_semantics_lite/src/provider_time_semantic_admission.py
          grep -F '"canonical_event_count": "UNKNOWN"' "$P"
          grep -F '"true_action_count": "UNKNOWN"' "$P"
          grep -F '"production_release": False' "$P"

      - name: No sample identity leak
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(
              'hpfa/modules/core/provider_alias_field_semantics_lite/src/provider_time_semantic_admission.py'
          ).read_text(encoding='utf-8')
          forbidden = ['Turkey', 'Australia', 'World Cup', 'Fenerbahce', 'Galatasaray', '25.06.2026']
          assert not any(token in text for token in forbidden)
          PY
