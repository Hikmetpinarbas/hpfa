name: Residual Event Mismatch Diagnostic Lite V1

on:
  pull_request:
    paths:
      - 'hpfa/modules/core/residual_event_mismatch_diagnostic_lite/**'
      - '.github/workflows/residual-event-mismatch-diagnostic-lite-v1.yml'
  push:
    branches:
      - base-event-label-main-rule-match-test-v1

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/residual_event_mismatch_diagnostic_lite/src/residual_event_mismatch_diagnostic.py \
            hpfa/modules/core/residual_event_mismatch_diagnostic_lite/tests/test_residual_event_mismatch_diagnostic.py
      - name: Focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -vv --tb=short hpfa/modules/core/residual_event_mismatch_diagnostic_lite/tests/test_residual_event_mismatch_diagnostic.py
