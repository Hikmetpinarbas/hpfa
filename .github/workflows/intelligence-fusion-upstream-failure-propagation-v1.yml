name: Intelligence Fusion Upstream Failure Propagation V1

on:
  pull_request:
    branches:
      - work/reconstruct-visible-sequence-partial-order-v1
    paths:
      - 'hpfa/modules/core/multi_signal_evidence_fusion_lite/**'
      - '.github/workflows/intelligence-fusion-upstream-failure-propagation-v1.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile producer and tests
        run: |
          python -m py_compile hpfa/modules/core/multi_signal_evidence_fusion_lite/src/multi_signal_evidence_fusion.py
          python -m py_compile hpfa/modules/core/multi_signal_evidence_fusion_lite/tests/test_multi_signal_evidence_fusion.py

      - name: Run fusion regression suite
        run: python -m pytest -q hpfa/modules/core/multi_signal_evidence_fusion_lite/tests/test_multi_signal_evidence_fusion.py

      - name: Claim and match-agnostic guards
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('hpfa/modules/core/multi_signal_evidence_fusion_lite/src/multi_signal_evidence_fusion.py').read_text(encoding='utf-8')
          tests = Path('hpfa/modules/core/multi_signal_evidence_fusion_lite/tests/test_multi_signal_evidence_fusion.py').read_text(encoding='utf-8')
          assert 'upstream_packet_failed_closed' in source
          assert 'upstream_hard_block_hits' in source
          assert 'canonical_event_count' in source
          assert 'test_failed_upstream_packet_blocks_fusion' in tests
          assert 'test_block_packet_decision_blocks_fusion' in tests
          assert 'test_packet_hard_block_hits_propagate_to_fusion' in tests
          for token in ('Genclerbirligi', 'Fenerbahce', '15.08.2026'):
              assert token not in source
              assert token not in tests
          PY
