name: ACTIVE_MATCH Pipeline Manifest Lite V1

on:
  pull_request:
    paths:
      - 'hpfa/modules/core/active_match_pipeline_manifest_lite/**'
      - '.github/workflows/active-match-pipeline-manifest-lite-v1.yml'
  push:
    branches:
      - base-event-label-main-rule-match-test-v1

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/active_match_pipeline_manifest_lite/src/active_match_pipeline_manifest.py \
            hpfa/modules/core/active_match_pipeline_manifest_lite/tests/test_active_match_pipeline_manifest.py
      - name: Focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -vv --tb=short hpfa/modules/core/active_match_pipeline_manifest_lite/tests/test_active_match_pipeline_manifest.py
      - name: No sample match identity leak
        run: |
          if grep -RInE 'Australia|Turkey|World Cup|6935|77798' \
            hpfa/modules/core/active_match_pipeline_manifest_lite; then
            echo sample_identity_leak
            exit 1
          fi
