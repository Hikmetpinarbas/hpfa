name: Triangulated Event Reflection Resolver Lite V1

on:
  push:
    branches:
      - work/reconstruct-185-research-hardened-v1
  pull_request:
    paths:
      - hpfa/modules/core/triangulated_event_reflection_resolver_lite/**
      - docs/contracts/triangulated_event_reflection_resolver_lite_v1.md
      - .github/workflows/triangulated-event-reflection-resolver-lite-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reflection-resolver-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile resolver
        run: python -m py_compile hpfa/modules/core/triangulated_event_reflection_resolver_lite/src/triangulated_event_reflection_resolver.py
      - name: Run deterministic resolver tests
        run: python -m pytest hpfa/modules/core/triangulated_event_reflection_resolver_lite/tests -q
      - name: Verify sample match identity leak guard
        run: python -m pytest hpfa/modules/core/triangulated_event_reflection_resolver_lite/tests/test_triangulated_event_reflection_resolver.py::test_no_sample_match_identity_leak -q
