name: Cross-Role Relation Current V1

on:
  pull_request:
    branches:
      - work/reconstruct-multi-family-taxonomy-current-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-role-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Exact head gate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Compile current cross-role migration
        run: |
          python -m py_compile \
            cross_role_relation_candidate_resolver_current_v1.py \
            action_bundle_multi_family_review_taxonomy_current_v1.py \
            hpfa/modules/core/cross_role_relation_candidate_resolver_lite/src/cross_role_relation_candidate_resolver.py

      - name: Focused current cross-role tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/cross_role_relation_candidate_resolver_lite/tests/test_current_contract_migration.py

      - name: Current Multi-Family Taxonomy compatibility tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/action_bundle_multi_family_review_taxonomy_lite/tests/test_current_contract_migration.py

      - name: Current Semantic Action Bundle compatibility tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/semantic_role_action_bundle_candidates_lite/tests/test_current_contract_migration.py

      - name: Current Match-Local Identity compatibility tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/match_local_identity_candidates_lite/tests/test_current_evidence_atom_migration.py

      - name: Current Evidence Atom compatibility tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/evidence_atom_inventory_lite/tests/test_current_row_nucleus_migration.py

      - name: Current Row Nucleus compatibility tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/row_nucleus_inventory_lite/tests/test_content_role_bridge.py \
            hpfa/modules/core/row_nucleus_inventory_lite/tests/test_row_nucleus_inventory.py

      - name: Contract JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('hpfa/modules/core/cross_role_relation_candidate_resolver_lite/contract/cross_role_relation_candidate_resolver_lite_v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['module_id'] == 'cross_role_relation_candidate_resolver_lite_v1'
          assert payload['relation_rules']['relation_requires_exactly_two_bundles'] is True
          assert payload['relation_rules']['same_time_only_link_allowed'] is False
          assert payload['relation_rules']['source_row_order_is_temporal_truth'] is False
          assert payload['taxonomy_integrity']['every_review_bundle_covered_exactly_once'] is True
          assert payload['counting_policy']['double_count_suppression_is_final'] is False
          assert payload['claim_boundary']['cross_role_fusion_allowed'] is False
          assert payload['claim_boundary']['canonical_event_count'] == 'UNKNOWN'
          assert payload['claim_boundary']['true_action_count'] == 'UNKNOWN'
          assert payload['claim_boundary']['production_release'] is False
          PY

      - name: Termux bootstrap syntax
        run: bash -n tools/bootstrap_termux_cross_role_relation_current_v1.sh

      - name: Claim and match-agnostic guards
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('cross_role_relation_candidate_resolver_current_v1.py'),
              Path('hpfa/modules/core/cross_role_relation_candidate_resolver_lite/src/cross_role_relation_candidate_resolver.py'),
              Path('tools/bootstrap_termux_cross_role_relation_current_v1.sh'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          for token in ('Genclerbirligi', 'Fenerbahce', '15.08.2026'):
              assert token not in text, token
          for required in ('canonical_event_count', 'true_action_count', 'cross_role_fusion_allowed'):
              assert required in text
          PY

      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }}..HEAD
