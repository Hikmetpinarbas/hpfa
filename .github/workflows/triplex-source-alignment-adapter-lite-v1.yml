name: Triplex Source Alignment Adapter Lite V1

on:
  push:
    branches:
      - feat/triplex-source-alignment-adapter-lite-v1
  pull_request:
    paths:
      - hpfa/modules/core/triplex_source_alignment_adapter_lite/**
      - docs/contracts/triplex_source_alignment_adapter_lite_v1.md
      - .github/workflows/triplex-source-alignment-adapter-lite-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile adapter
        run: python -m py_compile hpfa/modules/core/triplex_source_alignment_adapter_lite/src/triplex_source_alignment_adapter.py
      - name: Run deterministic adapter tests
        run: python -m pytest hpfa/modules/core/triplex_source_alignment_adapter_lite/tests -q
