name: Provider Label Value Semantics Lite V1

on:
  pull_request:
    paths:
      - "hpfa/modules/core/provider_label_value_semantics_lite/**"
      - "provider_label_value_semantics_lite.py"
      - "tools/bootstrap_termux_provider_label_value_semantics_v1.sh"
      - "tools/run_active_match_provider_label_value_semantics_v1.sh"
      - "docs/governance/HPFA_DEVELOPMENT_CHECKPOINT_CURRENT.json"
      - ".github/workflows/provider-label-value-semantics-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: python -m pip install pytest openpyxl
      - name: Compile
        run: |
          python -m py_compile             provider_label_value_semantics_lite.py             hpfa/modules/core/provider_label_value_semantics_lite/src/provider_label_value_semantics.py
      - name: Focused tests
        run: python -m pytest -q hpfa/modules/core/provider_label_value_semantics_lite/tests
      - name: Upstream #172 compatibility
        run: python -m pytest -q hpfa/modules/core/provider_alias_field_semantics_lite/tests
      - name: Shell syntax and execution identity
        run: |
          bash -n tools/run_active_match_provider_label_value_semantics_v1.sh
          bash -n tools/bootstrap_termux_provider_label_value_semantics_v1.sh
          bash tools/run_active_match_provider_label_value_semantics_v1.sh --self-test-execution-identity-guard
      - name: Historical final capability blob lineage
        run: |
          test "$(git hash-object docs/contracts/provider_label_value_semantics_lite_v1.md)" = "67e9f53d1c91586404f0fc9befae6e605cb204f0"
          test "$(git hash-object hpfa/modules/core/provider_label_value_semantics_lite/registry/sportsbase_label_semantics_reviewed_v2.csv)" = "47f004f1d83838e6ae7dfe7ec8976162bd53d6a9"
          test "$(git hash-object hpfa/modules/core/provider_label_value_semantics_lite/registry/sportsbase_label_semantics_seed_v1.json)" = "e2c7f721f5ea9060e86d8b4487ef0775fd74c64e"
          test "$(git hash-object hpfa/modules/core/provider_label_value_semantics_lite/src/provider_label_value_semantics.py)" = "72e4818e8f155c7ea7984afa73f4fc5dde055c07"
          test "$(git hash-object hpfa/modules/core/provider_label_value_semantics_lite/tests/test_provider_label_value_semantics.py)" = "74b6a0d7fcb40136d596196c7a716bfd5c6f23ac"
          test "$(git hash-object hpfa/modules/core/provider_label_value_semantics_lite/tests/test_provider_label_value_semantics_registry_safety.py)" = "069e64a98bd940a40485d8c259e877ee621dcf2f"
          test "$(git hash-object provider_label_value_semantics_lite.py)" = "7d8fee4ef7735bd1f134b470125a6eeab0d0a4e7"
      - name: Checkpoint resolver policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("docs/governance/HPFA_DEVELOPMENT_CHECKPOINT_CURRENT.json").read_text())
          assert p["record_role"] == "CURRENT_STATE_RESOLUTION_POLICY"
          assert p["authorities"]["engineering_head"]["authority"] == "GIT_BRANCH_REF"
          assert p["authorities"]["ci_state"]["authority"] == "GITHUB_ACTIONS_EXACT_HEAD"
          assert p["authorities"]["active_match_state"]["authority"] == "runtime/active_single_match/current"
          assert p["self_reference_policy"]["embed_containing_commit_sha"] is False
          assert p["runtime_handoff_policy"]["phone_output_mode"] == "ONE_ZIP_ONLY"
          assert p["runtime_handoff_policy"]["phone_runtime_pytest"] is False
          assert p["runtime_handoff_policy"]["single_pass_upstream_refresh"] is True
          assert p["research_acceptance"]["R09_observation_completeness"].startswith("ACCEPT_P0_NOW_SPEC")
          assert p["claim_boundary"]["canonical_event_count"] == "UNKNOWN"
          assert p["claim_boundary"]["production_release"] is False
          PY
      - name: Runtime operability guards
        run: |
          ! grep -F 'python -m pytest' tools/run_active_match_provider_label_value_semantics_v1.sh
          ! grep -F 'run_active_match_csv_surface_reader_v1.sh' tools/run_active_match_provider_label_value_semantics_v1.sh
          ! grep -F 'run_active_match_xlsx_surface_reader_v1.sh' tools/run_active_match_provider_label_value_semantics_v1.sh
          ! grep -F 'run_active_match_xml_surface_reader_v1.sh' tools/run_active_match_provider_label_value_semantics_v1.sh
          grep -F 'ONE_ZIP_ONLY' docs/governance/HPFA_DEVELOPMENT_CHECKPOINT_CURRENT.json
          grep -F 'HPFA_175_ACTIVE_MATCH_' tools/run_active_match_provider_label_value_semantics_v1.sh
          grep -F 'nested_phone_output_directory_rejected' tools/run_active_match_provider_label_value_semantics_v1.sh
      - name: Claim boundary and no sample identity leak
        run: |
          grep -F 'CANONICAL_EVENT_COUNT = "UNKNOWN"' hpfa/modules/core/provider_label_value_semantics_lite/src/provider_label_value_semantics.py
          ! grep -RInE "Sturm Graz|Heart of Midlothian|Australia|Turkey|World Cup|6935|77798"             provider_label_value_semantics_lite.py             hpfa/modules/core/provider_label_value_semantics_lite/src             tools/run_active_match_provider_label_value_semantics_v1.sh             tools/bootstrap_termux_provider_label_value_semantics_v1.sh
