name: Coordinate Frame Precondition Lite V1

on:
  pull_request:
    paths:
      - "coordinate_frame_precondition_lite.py"
      - "hpfa/modules/core/coordinate_frame_precondition_lite/**"
      - "docs/contracts/coordinate_frame_precondition_lite_v1.md"
      - "docs/research/eventonly/coordinate_frame_precondition_operator_research_prompts_v1.md"
      - "tools/*coordinate_frame_precondition_v1.sh"
      - ".github/workflows/coordinate-frame-precondition-lite-v1.yml"
  workflow_dispatch:

concurrency:
  group: coordinate-frame-precondition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Exact head gate
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile
        run: |
          python -m py_compile coordinate_frame_precondition_lite.py
          python -m compileall -q hpfa/modules/core/coordinate_frame_precondition_lite/src

      - name: Focused tests
        run: python -m pytest -q hpfa/modules/core/coordinate_frame_precondition_lite/tests

      - name: Contract JSON
        run: python -m json.tool hpfa/modules/core/coordinate_frame_precondition_lite/contract/coordinate_frame_precondition_lite_v1.json >/dev/null

      - name: Shell syntax
        run: |
          bash -n tools/run_active_match_coordinate_frame_precondition_v1.sh
          bash -n tools/bootstrap_termux_coordinate_frame_precondition_v1.sh

      - name: Claim and sample identity guards
        run: |
          grep -q 'canonical_event_count.*UNKNOWN' hpfa/modules/core/coordinate_frame_precondition_lite/src/coordinate_frame_precondition.py
          grep -q 'production_release.*False' hpfa/modules/core/coordinate_frame_precondition_lite/src/coordinate_frame_precondition.py
          ! grep -R -E 'Australia|Turkey|World Cup|Galatasaray|Juventus|6935|77798' hpfa/modules/core/coordinate_frame_precondition_lite/src

      - name: Diff hygiene
        run: git diff --check
