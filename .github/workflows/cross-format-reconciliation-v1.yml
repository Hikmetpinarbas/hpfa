name: Cross-Format Reconciliation Lite V1

on:
  pull_request:
    paths:
      - "cross_format_reconciliation_lite.py"
      - "hpfa/modules/core/cross_format_reconciliation_lite/**"
      - "hpfa/modules/core/provider_label_value_semantics_lite/**"
      - "docs/contracts/cross_format_reconciliation_lite_v1.md"
      - "tools/bootstrap_termux_cross_format_reconciliation_v1.sh"
      - "tools/run_active_match_cross_format_reconciliation_v1.sh"
      - ".github/workflows/cross-format-reconciliation-v1.yml"
  workflow_dispatch:

concurrency:
  group: cross-format-reconciliation-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pytest openpyxl
      - name: Compile
        run: |
          python -m py_compile \
            cross_format_reconciliation_lite.py \
            hpfa/modules/core/cross_format_reconciliation_lite/src/cross_format_reconciliation.py \
            hpfa/modules/core/cross_format_reconciliation_lite/tests/test_cross_format_reconciliation.py
      - name: Focused tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/provider_label_value_semantics_lite/tests \
            hpfa/modules/core/cross_format_reconciliation_lite/tests
      - name: Shell syntax
        run: bash -n tools/run_active_match_cross_format_reconciliation_v1.sh tools/bootstrap_termux_cross_format_reconciliation_v1.sh
      - name: Claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path("hpfa/modules/core/cross_format_reconciliation_lite/contract/cross_format_reconciliation_lite_v1.json").read_text())
          boundary = contract["claim_boundary"]
          assert boundary["canonical_event_count"] == "UNKNOWN"
          assert boundary["validated_cross_format_equivalence"] is False
          assert boundary["xlsx_independent_confirmation"] is False
          assert boundary["aggregate_definition_truth"] is False
          assert boundary["tactical_truth"] is False
          assert boundary["production_release"] is False
          assert "provider_label_value_semantics_lite_v1.json" in contract["inputs"]
          assert "source_sha_missing" in contract["hard_blocks"]
          assert "runtime_sha_mismatch" in contract["hard_blocks"]
          assert "candidate_signature_without_id" in contract["reconciliation_record_required_fields"]
          assert contract["top_level_status_fields"] == [
              "module_status",
              "runtime_evidence_status",
              "release_status",
          ]
          assert "ACTIVE_MATCH_EVIDENCE_PASS" in contract["runtime_evidence_status_states"]
          assert "NOT_PRODUCTION" in contract["release_status_states"]
          PY
      - name: No sample identity leak
        run: python -m pytest -q hpfa/modules/core/cross_format_reconciliation_lite/tests/test_cross_format_reconciliation.py::test_no_sample_match_identity_leak
