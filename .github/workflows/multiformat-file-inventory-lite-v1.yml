name: Multiformat File Inventory Lite V1

on:
  pull_request:
    paths:
      - "multiformat_file_inventory.py"
      - "hpfa/modules/core/multiformat_file_inventory_lite/**"
      - "docs/contracts/multiformat_file_inventory_lite_v1.md"
      - "tools/run_active_match_multiformat_inventory_v1.sh"
      - "tools/bootstrap_termux_multiformat_inventory_v1.sh"
      - ".github/workflows/multiformat-file-inventory-lite-v1.yml"
  workflow_dispatch:

concurrency:
  group: multiformat-file-inventory-lite-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest openpyxl xlrd
      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/multiformat_file_inventory_lite/src/multiformat_file_inventory.py \
            hpfa/modules/core/multiformat_file_inventory_lite/src/multiformat_file_inventory_impl.py \
            hpfa/modules/core/multiformat_file_inventory_lite/tests/test_multiformat_file_inventory.py \
            hpfa/modules/core/multiformat_file_inventory_lite/tests/test_review_regressions.py \
            multiformat_file_inventory.py
      - name: Focused tests
        run: python -m pytest -q hpfa/modules/core/multiformat_file_inventory_lite/tests
      - name: Shell syntax
        run: |
          bash -n tools/run_active_match_multiformat_inventory_v1.sh
          bash -n tools/bootstrap_termux_multiformat_inventory_v1.sh
      - name: Exact product-repo origin guard
        run: bash tools/run_active_match_multiformat_inventory_v1.sh --self-test-repo-guard
      - name: Exact integration branch/head guard contract
        run: |
          HPFA_EXPECTED_BRANCH="integration/guard-test" \
          HPFA_EXPECTED_HEAD="0123456789abcdef0123456789abcdef01234567" \
          bash tools/run_active_match_multiformat_inventory_v1.sh --self-test-execution-guard
      - name: Claim-boundary enforcement
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          src = Path("hpfa/modules/core/multiformat_file_inventory_lite/src")
          sys.path.insert(0, str(src))
          from multiformat_file_inventory import build_inventory
          result = build_inventory("definitely-missing-input-root")
          assert result["canonical_event_count"] == "UNKNOWN"
          assert result["active_match_evidence_pass"] is False
          assert result["production_release"] is False
          PY
      - name: Product-code sample identity leak guard
        run: |
          ! grep -R -E "Australia|Turkey|World Cup|6935|77798" \
            hpfa/modules/core/multiformat_file_inventory_lite/src \
            multiformat_file_inventory.py \
            tools/run_active_match_multiformat_inventory_v1.sh \
            tools/bootstrap_termux_multiformat_inventory_v1.sh
