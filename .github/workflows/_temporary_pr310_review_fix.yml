name: Temporary PR310 Review Fix

on:
  push:
    branches:
      - maintenance/capability-closure-guard-v1
    paths:
      - .github/workflows/_temporary_pr310_review_fix.yml

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/capability-closure-guard-v1
          fetch-depth: 0

      - name: Apply exact review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('hpfa/modules/core/capability_closure_guard_lite/src/capability_closure_guard.py')
          test_path = Path('hpfa/modules/core/capability_closure_guard_lite/tests/test_review_fix_tour4.py')
          workflow_path = Path('.github/workflows/_temporary_pr310_review_fix.yml')
          source = source_path.read_text(encoding='utf-8')

          old = '''def _scope_path_bindings(
              statements: list[ast.stmt],
              trusted_root: Path,
              source_path: Path | None,
              helper_paths: dict[str, Path],
              initial_paths: dict[str, Path] | None = None,
          ) -> dict[str, Path]:
              known = dict(initial_paths or {})
              for node in statements:
                  _update_path_binding(node, trusted_root, source_path, helper_paths, known)
              return known
          '''
          new = '''def _compound_statement_bodies(statement: ast.stmt) -> list[list[ast.stmt]]:
              if isinstance(statement, (ast.If, ast.For, ast.AsyncFor, ast.While)):
                  return [statement.body, statement.orelse]
              if isinstance(statement, (ast.With, ast.AsyncWith)):
                  return [statement.body]
              if isinstance(statement, ast.Try):
                  return [
                      statement.body,
                      *(handler.body for handler in statement.handlers),
                      statement.orelse,
                      statement.finalbody,
                  ]
              try_star = getattr(ast, "TryStar", None)
              if try_star is not None and isinstance(statement, try_star):
                  return [
                      statement.body,
                      *(handler.body for handler in statement.handlers),
                      statement.orelse,
                      statement.finalbody,
                  ]
              if isinstance(statement, ast.Match):
                  return [case.body for case in statement.cases]
              return []


          def _compound_assigned_names(statement: ast.stmt) -> set[str]:
              names: set[str] = set()

              def visit(node: ast.AST) -> None:
                  if isinstance(node, LEXICAL_SCOPE_NODES):
                      return
                  target_name, _value = _assignment_target_value(node)
                  if target_name:
                      names.add(target_name)
                  for child in ast.iter_child_nodes(node):
                      visit(child)

              for body in _compound_statement_bodies(statement):
                  for child in body:
                      visit(child)
              return names


          def _scope_path_bindings(
              statements: list[ast.stmt],
              trusted_root: Path,
              source_path: Path | None,
              helper_paths: dict[str, Path],
              initial_paths: dict[str, Path] | None = None,
          ) -> dict[str, Path]:
              known = dict(initial_paths or {})
              for node in statements:
                  if _compound_statement_bodies(node):
                      # Multiple runtime branches cannot safely be collapsed into one
                      # trusted static binding. Any name rebound inside the compound
                      # statement is invalidated for later lexical consumers.
                      for name in _compound_assigned_names(node):
                          known.pop(name, None)
                      continue
                  _update_path_binding(node, trusted_root, source_path, helper_paths, known)
              return known
          '''
          if old not in source:
              raise SystemExit('scope_path_bindings_pattern_missing')
          source = source.replace(old, new, 1)

          old = '''    for statement in statements:
                  bound_names = {
                      name
                      for name, candidate in known.items()
                      if _safe_resolve(candidate) == expected
                  }
          '''
          new = '''    for statement in statements:
                  compound_bodies = _compound_statement_bodies(statement)
                  if compound_bodies:
                      for body in compound_bodies:
                          if _scope_has_exact_src_binding(
                              body,
                              expected,
                              trusted_root,
                              source_path,
                              helper_paths,
                              dict(known),
                              trusted_function_params,
                          ):
                              return True
                      for name in _compound_assigned_names(statement):
                          known.pop(name, None)
                      continue

                  bound_names = {
                      name
                      for name, candidate in known.items()
                      if _safe_resolve(candidate) == expected
                  }
          '''
          if old not in source:
              raise SystemExit('scope_order_pattern_missing')
          source = source.replace(old, new, 1)

          old = '''        imported_functions: dict[str, str] = {}
                  for node in tree.body:
                      if not isinstance(node, ast.ImportFrom) or not node.module:
                          continue
                      module_leaf = node.module.split(".")[-1]
                      for alias in node.names:
                          if alias.name == "*":
                              continue
                          imported_functions[alias.asname or alias.name] = module_leaf
          '''
          new = '''        imported_functions: dict[str, tuple[str, str]] = {}
                  for node in tree.body:
                      if not isinstance(node, ast.ImportFrom) or not node.module:
                          continue
                      qualified_module = node.module
                      module_leaf = qualified_module.split(".")[-1]
                      for alias in node.names:
                          if alias.name == "*":
                              continue
                          imported_functions[alias.asname or alias.name] = (
                              qualified_module,
                              module_leaf,
                          )
          '''
          if old not in source:
              raise SystemExit('entrypoint_import_pattern_missing')
          source = source.replace(old, new, 1)

          old = '''                    module_leaf = imported_functions[call.func.id]
                              for cid, implementation_file in leaf_candidates.get(module_leaf, []):
                                  module_dir = Path(str(implementations[cid]["module_dir"]))
                                  if not _has_explicit_product_src_binding(
                                      text,
                                      module_dir,
                                      trusted_root,
                                      source_path=wrapper,
                                  ):
                                      continue
                                  seeds.setdefault(implementation_file.resolve(), {}).setdefault(
                                      call.func.id, set()
                                  ).add("root")
          '''
          new = '''                    qualified_module, module_leaf = imported_functions[call.func.id]
                              for cid, implementation_file in leaf_candidates.get(module_leaf, []):
                                  module_dir = Path(str(implementations[cid]["module_dir"]))
                                  expected_qualified = (
                                      f"{str(module_dir).replace('/', '.')}.src.{module_leaf}"
                                  )
                                  explicit_current_binding = _has_explicit_product_src_binding(
                                      text,
                                      module_dir,
                                      trusted_root,
                                      source_path=wrapper,
                                  )
                                  qualified_current_import = qualified_module == expected_qualified
                                  proven_bare_current_import = (
                                      qualified_module == module_leaf and explicit_current_binding
                                  )
                                  if not (qualified_current_import or proven_bare_current_import):
                                      continue
                                  seeds.setdefault(implementation_file.resolve(), {}).setdefault(
                                      call.func.id, set()
                                  ).add("root")
          '''
          if old not in source:
              raise SystemExit('entrypoint_seed_pattern_missing')
          source = source.replace(old, new, 1)

          source_path.write_text(source, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_compound_statement_rebinds_are_evaluated_before_helper_calls'
          if marker not in tests:
              tests += r'''


def test_compound_statement_rebinds_are_evaluated_before_helper_calls(tmp_path):
    current_src = _current_src(tmp_path)
    foreign_src = tmp_path.parent / "compound_foreign" / MODULE_DIR / "src"
    foreign_src.mkdir(parents=True, exist_ok=True)
    source_path = tmp_path / "consumer.py"
    bodies = [
        "if True:\n    src = Path({foreign!r})\n    ensure_module_path(src)\n",
        "for _ in [1]:\n    src = Path({foreign!r})\n    ensure_module_path(src)\n",
        "try:\n    src = Path({foreign!r})\n    ensure_module_path(src)\nexcept Exception:\n    pass\n",
        "with open(__file__):\n    src = Path({foreign!r})\n    ensure_module_path(src)\n",
    ]
    for body in bodies:
        text = (
            f"src = Path({str(current_src)!r})\n"
            + body.format(foreign=str(foreign_src))
            + "import client\n"
        )
        assert guard._has_explicit_product_src_binding(
            text, MODULE_DIR, tmp_path, source_path=source_path
        ) is False


def test_foreign_qualified_entrypoint_import_cannot_seed_current_module(tmp_path):
    current_src = _current_src(tmp_path)
    (current_src / "client.py").write_text("def run(root):\n    return root\n", encoding="utf-8")
    wrapper = tmp_path / "wrapper.py"
    wrapper.write_text(
        "from pathlib import Path\n"
        "ROOT = Path(__file__).resolve().parent\n"
        f"src = Path({str(current_src)!r})\n"
        "ensure_module_path(src)\n"
        "from vendor.client import run\n"
        "run(root=ROOT)\n",
        encoding="utf-8",
    )
    implementations = guard.discover_implementations(tmp_path)
    seeds = guard._trusted_entrypoint_root_seeds(tmp_path, implementations)
    assert (current_src / "client.py").resolve() not in seeds


def test_exact_current_qualified_entrypoint_import_can_seed_current_module(tmp_path):
    current_src = _current_src(tmp_path)
    (current_src / "client.py").write_text("def run(root):\n    return root\n", encoding="utf-8")
    wrapper = tmp_path / "wrapper.py"
    wrapper.write_text(
        "from pathlib import Path\n"
        "ROOT = Path(__file__).resolve().parent\n"
        "from hpfa.modules.core.sample_lite.src.client import run\n"
        "run(root=ROOT)\n",
        encoding="utf-8",
    )
    implementations = guard.discover_implementations(tmp_path)
    seeds = guard._trusted_entrypoint_root_seeds(tmp_path, implementations)
    assert seeds[(current_src / "client.py").resolve()]["run"] == {"root"}
          '''
              test_path.write_text(tests, encoding='utf-8')

          workflow_path.unlink()
          PY

      - name: Validate focused suite
        run: |
          python -m py_compile hpfa/modules/core/capability_closure_guard_lite/src/capability_closure_guard.py
          python -m pytest -q hpfa/modules/core/capability_closure_guard_lite/tests

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          git config user.name "HPFA Maintenance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hpfa/modules/core/capability_closure_guard_lite/src/capability_closure_guard.py
          git add hpfa/modules/core/capability_closure_guard_lite/tests/test_review_fix_tour4.py
          git add .github/workflows/_temporary_pr310_review_fix.yml
          git commit -m "Fix PR310 consumer binding review blockers"
          git push origin HEAD:maintenance/capability-closure-guard-v1
