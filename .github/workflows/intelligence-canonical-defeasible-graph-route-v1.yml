name: Intelligence Canonical Defeasible Graph Route V1

on:
  pull_request:
    branches:
      - fix/intelligence-argument-recursive-guard-v1
    paths:
      - 'hpfa/modules/core/defeasible_argument_router_lite/**'
      - 'hpfa/modules/core/evidence_graph_engine_lite/**'
      - 'docs/contracts/defeasible_argument_router_lite_v1.md'
      - 'docs/contracts/evidence_graph_engine_lite_v1.md'
      - '.github/workflows/intelligence-canonical-defeasible-graph-route-v1.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile route and graph producers
        run: |
          python -m py_compile hpfa/modules/core/defeasible_argument_router_lite/src/defeasible_argument_router.py
          python -m py_compile hpfa/modules/core/evidence_graph_engine_lite/src/evidence_graph_engine.py
          python -m py_compile hpfa/modules/core/defeasible_argument_router_lite/tests/test_defeasible_argument_router.py
          python -m py_compile hpfa/modules/core/evidence_graph_engine_lite/tests/test_evidence_graph_engine.py

      - name: Run route and graph regressions
        run: |
          python -m pytest -q hpfa/modules/core/defeasible_argument_router_lite/tests/test_defeasible_argument_router.py
          python -m pytest -q hpfa/modules/core/evidence_graph_engine_lite/tests/test_evidence_graph_engine.py

      - name: Canonical route and review guards
        run: |
          python - <<'PY'
          from pathlib import Path
          router = Path('hpfa/modules/core/defeasible_argument_router_lite/src/defeasible_argument_router.py').read_text(encoding='utf-8')
          graph = Path('hpfa/modules/core/evidence_graph_engine_lite/src/evidence_graph_engine.py').read_text(encoding='utf-8')
          graph_contract = Path('docs/contracts/evidence_graph_engine_lite_v1.md').read_text(encoding='utf-8')
          assert 'defeasible_argument_candidate_only' in router
          assert 'UPSTREAM_CLAIM_CEILING = "defeasible_argument_candidate_only"' in graph
          assert 'ROUTE_EVIDENCE_GRAPH_TO_REVIEW' in graph
          assert 'defeasible_argument_weakened' in graph
          assert 'defeasible_argument_withdrawn' in graph
          assert '_collect_forbidden_hits' in graph
          assert 'defeasible_argument_router_lite_v1' in graph_contract
          for source in (router, graph):
              assert 'canonical_event_count' in source
          for token in ('Genclerbirligi', 'Fenerbahce', '15.08.2026'):
              assert token not in router
              assert token not in graph
          PY
