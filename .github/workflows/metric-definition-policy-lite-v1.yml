name: Metric Definition Policy Lite V1

on:
  push:
    branches:
      - agent/metric-definition-policy-lite-v1
  pull_request:
    paths:
      - configs/metrics/**
      - hpfa/modules/core/metric_definition_policy_lite/**
      - docs/contracts/metric_definition_policy_lite_v1.md
      - .github/workflows/metric-definition-policy-lite-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile policy module
        run: python -m py_compile hpfa/modules/core/metric_definition_policy_lite/src/metric_definition_policy.py
      - name: Run deterministic policy tests
        run: python -m pytest hpfa/modules/core/metric_definition_policy_lite/tests -q
