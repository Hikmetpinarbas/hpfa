name: Full Repo Health Audit V1

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: hpfa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-repo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openpyxl numpy pandas pydantic PyYAML

      - name: Validate Termux operator scripts
        run: |
          bash -n tools/termux_active_match_crash_probe_v1.sh
          bash -n tools/termux_p1_physical_acceptance_v1.sh

      - name: Validate distribution contract
        run: |
          python -m pytest -q tests/test_distribution_contract_v1.py
          mkdir -p "$RUNNER_TEMP/hpfa-wheel"
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/hpfa-wheel"
          python - "$RUNNER_TEMP/hpfa-wheel" <<'PYCODE'
          import sys
          import zipfile
          from pathlib import Path

          wheels = sorted(Path(sys.argv[1]).glob("hpfa-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected_one_hpfa_wheel:{len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          required = {
              "hpfa_core": any(name.startswith("hpfa/modules/core/") and name.endswith(".py") for name in names),
              "registry_data": any("/registry/" in name and name.endswith((".json", ".csv", ".tsv")) for name in names),
              "license": any("LICENSE" in name for name in names),
              "notice": any("/NOTICE" in name or name.endswith("/NOTICE") for name in names),
          }
          forbidden = {
              "vendor": any(name.startswith("vendor/") for name in names),
              "runtime": any(name.startswith("runtime/") for name in names),
              "out": any(name.startswith("out/") for name in names),
          }
          if not all(required.values()) or any(forbidden.values()):
              raise SystemExit({"required": required, "forbidden": forbidden})
          PYCODE

      - name: Fail-local repository compile and product test audit
        id: full_audit
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/hpfa-full-repo-audit"
          python repo_fail_local_product_test_audit_v1.py \
            --out-dir "$RUNNER_TEMP/hpfa-full-repo-audit" \
            --timeout-seconds 1800 \
            --per-file-timeout-seconds 300

      - name: Upload full repo audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpfa-full-repo-health-audit-v1
          path: ${{ runner.temp }}/hpfa-full-repo-audit/
          if-no-files-found: error

      - name: Enforce fail-local audit result
        if: steps.full_audit.outcome != 'success'
        run: |
          echo "Fail-local product audit did not pass. Inspect uploaded audit artifact."
          exit 1
