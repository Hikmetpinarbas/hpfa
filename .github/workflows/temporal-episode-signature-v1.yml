name: Temporal Episode Signature V1

on:
  pull_request:
    paths:
      - 'temporal_episode_signature.py'
      - 'tools/run_active_match_temporal_episode_signature_v1.sh'
      - 'hpfa/modules/core/temporal_episode_signature_lite/**'
      - 'hpfa/modules/core/episode_feature_vector_lite/**'
      - '.github/workflows/temporal-episode-signature-v1.yml'

permissions:
  contents: read

jobs:
  temporal-episode-signature:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head_sha=$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest openpyxl

      - name: Compile temporal chain
        run: |
          python -m compileall -q \
            hpfa/modules/core/temporal_episode_signature_lite \
            hpfa/modules/core/episode_feature_vector_lite \
            temporal_episode_signature.py

      - name: Run temporal tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/temporal_episode_signature_lite/tests/test_temporal_episode_signature.py

      - name: Run upstream episode feature regressions
        run: |
          python -m pytest -q \
            hpfa/modules/core/episode_feature_vector_lite/tests/test_episode_feature_vector.py \
            hpfa/modules/core/episode_feature_vector_lite/tests/test_episode_feature_vector_duration_guard.py

      - name: Temporal policy guards
        shell: bash
        run: |
          set -euo pipefail
          P=hpfa/modules/core/temporal_episode_signature_lite/src/temporal_episode_signature.py
          F=hpfa/modules/core/episode_feature_vector_lite/src/episode_feature_vector.py
          grep -F 'REVIEWED_ACTION_OCCURRENCE_ELIGIBLE_ONLY' "$P"
          grep -F 'same_timestamp_internal_ordering_allowed' "$P"
          grep -F 'source_row_order_is_temporal_truth' "$P"
          grep -F 'temporal_totals_add_action_volume' "$P"
          grep -F 'spectral_methods_applied' "$P"
          grep -F 'recurrence_truth_applied' "$P"
          grep -F 'ORDER_INDETERMINATE_SAME_START' "$P"
          grep -F 'NO_PRIOR_EPISODE_IN_PERIOD' "$P"
          ! grep -F 'context_ordinal' "$P"
          grep -F 'math.isfinite(duration)' "$F"
          grep -F 'episode_duration_invalid:' "$F"

      - name: Claim locks
        shell: bash
        run: |
          set -euo pipefail
          P=hpfa/modules/core/temporal_episode_signature_lite/src/temporal_episode_signature.py
          grep -F '"canonical_event_count": "UNKNOWN"' "$P"
          grep -F '"true_action_count": "UNKNOWN"' "$P"
          grep -F '"phase_truth": False' "$P"
          grep -F '"rhythm_truth": False' "$P"
          grep -F '"momentum_truth": False' "$P"
          grep -F '"physical_intensity_truth": False' "$P"
          grep -F '"production_release": False' "$P"

      - name: No sample identity leak
        run: |
          python - <<'PY'
          from pathlib import Path
          temporal = Path('hpfa/modules/core/temporal_episode_signature_lite/src/temporal_episode_signature.py').read_text(encoding='utf-8')
          feature = Path('hpfa/modules/core/episode_feature_vector_lite/src/episode_feature_vector.py').read_text(encoding='utf-8')
          forbidden = ['Fenerbahce', 'Galatasaray', 'Genclerbirligi', '15.08.2026', 'Turkey', 'World Cup']
          assert not any(token in temporal for token in forbidden)
          assert not any(token in feature for token in forbidden)
          assert 'context_ordinal' not in temporal
          assert 'context_ordinal' not in feature
          PY
