name: Aggregate Derivation Evidence Reconciliation Lite V1

on:
  pull_request:
    paths:
      - "aggregate_derivation_evidence_reconciliation_lite.py"
      - "hpfa/modules/core/aggregate_derivation_evidence_reconciliation_lite/**"
      - "docs/contracts/aggregate_derivation_evidence_reconciliation_lite_v1.md"
      - "tools/run_active_match_aggregate_derivation_evidence_reconciliation_v1.sh"
      - ".github/workflows/aggregate-derivation-evidence-reconciliation-lite-v1.yml"
  workflow_dispatch:

concurrency:
  group: g16-aggregate-derivation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact PR head gate
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/aggregate_derivation_evidence_reconciliation_lite/src/aggregate_derivation_evidence_reconciliation.py \
            hpfa/modules/core/aggregate_derivation_evidence_reconciliation_lite/tests/test_aggregate_derivation_evidence_reconciliation.py \
            aggregate_derivation_evidence_reconciliation_lite.py

      - name: Focused tests
        run: python -m pytest -q hpfa/modules/core/aggregate_derivation_evidence_reconciliation_lite/tests

      - name: Contract JSON
        run: python -m json.tool hpfa/modules/core/aggregate_derivation_evidence_reconciliation_lite/contract/aggregate_derivation_evidence_reconciliation_lite_v1.json >/dev/null

      - name: Termux runner shell syntax
        run: bash -n tools/run_active_match_aggregate_derivation_evidence_reconciliation_v1.sh
