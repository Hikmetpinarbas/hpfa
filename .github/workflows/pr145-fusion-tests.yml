name: PR145 fusion tests

on:
  push:
    branches:
      - p0-fusion-failure-propagation-v2
  pull_request:
    paths:
      - hpfa/modules/core/multi_signal_evidence_fusion_lite/**
      - scripts/run_core_module_tests.py
      - .github/workflows/pr145-fusion-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fusion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run fusion test gate
        run: python scripts/run_core_module_tests.py
