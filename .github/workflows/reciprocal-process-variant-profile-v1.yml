name: Reciprocal Process Variant Profile V1

on:
  pull_request:
    paths:
      - 'reciprocal_process_chain_current_v1.py'
      - 'hpfa/modules/core/reciprocal_process_chain_lite/**'
      - 'hpfa/modules/core/professional_finding_candidate_lite/src/process_variant_difference_binding.py'
      - 'hpfa/modules/core/professional_finding_candidate_lite/tests/test_process_variant_difference_binding.py'
      - '.github/workflows/reciprocal-process-variant-profile-v1.yml'
  push:
    branches:
      - 'feature/reciprocal-process-variant-profile-v1'
      - 'feature/zfgv-safe-finding-emission-gate-v1'

jobs:
  process-variant-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run process variant profile, difference and finding-binding regressions
        run: |
          python -m pytest -q \
            hpfa/modules/core/reciprocal_process_chain_lite/tests/test_process_variant_profile.py \
            hpfa/modules/core/reciprocal_process_chain_lite/tests/test_process_variant_difference.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_process_variant_difference_binding.py \
            hpfa/modules/core/reciprocal_process_chain_lite/tests/test_process_variant_bundle_ledger.py
      - name: Compile runtime binding
        run: |
          python -m py_compile reciprocal_process_chain_current_v1.py
          python -m py_compile hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_profile.py
          python -m py_compile hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_difference.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/process_variant_difference_binding.py
          python -m py_compile hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_profile_outputs.py
          python -m py_compile hpfa/modules/core/reciprocal_process_chain_lite/src/full_spine_packet_bridge.py
      - name: Football intelligence and claim lock audit
        run: |
          grep -F 'modal_resolution_class_candidate' hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_difference.py
          grep -F 'deviant_resolution_class_candidate' hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_difference.py
          grep -F 'visible_difference_candidates' hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_difference.py
          grep -F 'right_censoring_used_as_counterevidence' hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_difference.py
          grep -F 'process_variant_difference_analyst_summary_tr' hpfa/modules/core/professional_finding_candidate_lite/src/process_variant_difference_binding.py
          grep -F 'process_variant_difference_creates_independent_evidence' hpfa/modules/core/professional_finding_candidate_lite/src/process_variant_difference_binding.py
          grep -F 'repeat_candidate_is_recurrence_truth' hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_profile.py
          grep -F 'canonical_event_count=UNKNOWN' hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_profile_outputs.py
          grep -F 'true_action_count=UNKNOWN' hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_profile_outputs.py
          grep -F 'production_release=false' hpfa/modules/core/reciprocal_process_chain_lite/src/process_variant_profile_outputs.py
