name: Content Source Role Resolver Lite V1

on:
  pull_request:
    paths:
      - 'content_source_role_resolver.py'
      - 'hpfa/modules/core/content_source_role_resolver_lite/**'
      - 'docs/contracts/content_source_role_resolver_lite_v1.md'
      - '.github/workflows/content-source-role-resolver-lite-v1.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Exact PR head gate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Compile
        run: |
          python -m py_compile \
            content_source_role_resolver.py \
            hpfa/modules/core/content_source_role_resolver_lite/src/__init__.py \
            hpfa/modules/core/content_source_role_resolver_lite/src/content_source_role_resolver.py

      - name: Focused tests
        run: pytest -q hpfa/modules/core/content_source_role_resolver_lite/tests

      - name: Claim boundary
        run: |
          grep -q 'canonical_event_count=UNKNOWN' docs/contracts/content_source_role_resolver_lite_v1.md
          grep -q 'production_release=false' docs/contracts/content_source_role_resolver_lite_v1.md
          grep -q 'filename_support_used_for_admission=false' hpfa/modules/core/content_source_role_resolver_lite/src/content_source_role_resolver.py

      - name: No sample identity leak
        run: |
          ! grep -Eiq 'Genclerbirligi|Fenerbahce|15\.08\.2026' hpfa/modules/core/content_source_role_resolver_lite/src/content_source_role_resolver.py
          ! grep -Eiq 'Genclerbirligi|Fenerbahce|15\.08\.2026' hpfa/modules/core/content_source_role_resolver_lite/src/__init__.py
