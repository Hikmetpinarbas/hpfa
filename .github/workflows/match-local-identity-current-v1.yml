name: Match-Local Identity Current V1

on:
  pull_request:
    branches:
      - work/reconstruct-evidence-atom-current-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match-local-identity-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Exact head gate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Compile current identity migration
        run: |
          python -m py_compile \
            match_local_identity_candidates_lite.py \
            evidence_atom_inventory_lite.py \
            hpfa/modules/core/match_local_identity_candidates_lite/src/match_local_identity_candidates.py

      - name: Focused Match-Local Identity migration tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/match_local_identity_candidates_lite/tests

      - name: Current Evidence Atom compatibility tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/evidence_atom_inventory_lite/tests/test_current_row_nucleus_migration.py

      - name: Current Row Nucleus compatibility tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/row_nucleus_inventory_lite/tests/test_content_role_bridge.py \
            hpfa/modules/core/row_nucleus_inventory_lite/tests/test_row_nucleus_inventory.py

      - name: Contract JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('hpfa/modules/core/match_local_identity_candidates_lite/contract/match_local_identity_candidates_lite_v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['module_id'] == 'match_local_identity_candidates_lite_v1'
          assert payload['identity_scope'] == 'MATCH_LOCAL_CANDIDATE_ONLY'
          assert payload['binding_rules']['one_evidence_atom_one_identity_binding_record'] is True
          assert payload['source_rules']['xlsx_identity_allowed'] is False
          assert payload['claim_boundary']['canonical_event_count'] == 'UNKNOWN'
          assert payload['claim_boundary']['validated_team_identity'] is False
          assert payload['claim_boundary']['validated_player_identity'] is False
          assert payload['claim_boundary']['event_instance_allowed'] is False
          assert payload['claim_boundary']['cross_role_fusion_allowed'] is False
          assert payload['claim_boundary']['production_release'] is False
          PY

      - name: Termux bootstrap syntax
        run: bash -n tools/bootstrap_termux_match_local_identity_current_v1.sh

      - name: Claim and match-agnostic guards
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('match_local_identity_candidates_lite.py'),
              Path('hpfa/modules/core/match_local_identity_candidates_lite/src/match_local_identity_candidates.py'),
              Path('tools/bootstrap_termux_match_local_identity_current_v1.sh'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          forbidden = ['Genclerbirligi', 'Fenerbahce', '15.08.2026']
          for token in forbidden:
              assert token not in text, token
          for required in ('canonical_event_count', 'production_release', 'cross_role_fusion_allowed'):
              assert required in text
          PY

      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }}..HEAD
