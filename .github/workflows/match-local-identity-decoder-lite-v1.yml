name: Match-Local Identity Decoder Lite V1

on:
  pull_request:
    paths:
      - hpfa/modules/core/match_local_identity_decoder_lite/**
      - tools/run_active_match_identity_test_v1.sh
      - .github/workflows/match-local-identity-decoder-lite-v1.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile product module
        run: python -m py_compile hpfa/modules/core/match_local_identity_decoder_lite/src/match_local_identity_decoder.py
      - name: Validate ACTIVE_MATCH runner shell
        run: bash -n tools/run_active_match_identity_test_v1.sh
      - name: Focused tests
        run: python -m pytest hpfa/modules/core/match_local_identity_decoder_lite/tests -q
      - name: Enforce pre-bundle claim boundary
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          src = Path("hpfa/modules/core/match_local_identity_decoder_lite/src")
          sys.path.insert(0, str(src))
          from match_local_identity_decoder import build_match_local_identity_decoder
          result = build_match_local_identity_decoder({
              "match_binding_id": "ci_match",
              "evidence_atoms": [{
                  "evidence_atom_id": "ea_ci",
                  "match_binding_id": "ci_match",
                  "team_raw": "Team A",
                  "player_raw": "Player A",
                  "source_file": "Players.csv",
                  "source_format": "csv",
                  "source_role": "players",
                  "source_row_index": 1,
                  "source_extra_fields": {},
              }],
          })
          assert result["identity_bound_atom_count"] == 1
          assert result["identity_truth_admitted"] is False
          assert result["global_roster_identity_admitted"] is False
          assert result["base_event_admission_allowed"] is False
          assert result["event_instance_count"] == 0
          assert result["action_bundle_candidate_count"] == 0
          assert result["canonical_event_count"] == "UNKNOWN"
          assert result["production_release"] is False
          PY
      - name: No sample match identity leak
        run: |
          ! grep -RInE 'Australia|Turkey|World Cup|6935|77798' \
            hpfa/modules/core/match_local_identity_decoder_lite/src \
            tools/run_active_match_identity_test_v1.sh
