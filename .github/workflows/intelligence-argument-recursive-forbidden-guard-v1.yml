name: Intelligence Argument Recursive Forbidden Guard V1

on:
  pull_request:
    branches:
      - fix/intelligence-recursive-forbidden-field-guard-v1
    paths:
      - 'hpfa/modules/core/composite_argument_builder_lite/**'
      - '.github/workflows/intelligence-argument-recursive-forbidden-guard-v1.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile argument producer and tests
        run: |
          python -m py_compile hpfa/modules/core/composite_argument_builder_lite/src/composite_argument_builder.py
          python -m py_compile hpfa/modules/core/composite_argument_builder_lite/tests/test_composite_argument_builder.py

      - name: Run argument regression suite
        run: python -m pytest -q hpfa/modules/core/composite_argument_builder_lite/tests/test_composite_argument_builder.py

      - name: Recursive path-aware and claim guards
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('hpfa/modules/core/composite_argument_builder_lite/src/composite_argument_builder.py').read_text(encoding='utf-8')
          tests = Path('hpfa/modules/core/composite_argument_builder_lite/tests/test_composite_argument_builder.py').read_text(encoding='utf-8')
          assert '_collect_forbidden_hits' in source
          assert 'canonical_event_count' in source
          assert 'relation_records[0].payload.safe_sentence_candidate_tr' in tests
          assert 'relation_records[1].metadata.quality_truth' in tests
          for token in ('Genclerbirligi', 'Fenerbahce', '15.08.2026'):
              assert token not in source
              assert token not in tests
          PY
