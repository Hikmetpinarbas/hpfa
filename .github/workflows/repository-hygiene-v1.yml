name: Repository Hygiene V1

on:
  pull_request:
  push:

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run repository hygiene contract
        run: python -m pytest -q tests/test_repository_hygiene.py
