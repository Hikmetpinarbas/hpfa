name: Repository Hygiene V1

on:
  pull_request:
  push:

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HPFA test package
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Verify installed package outside checkout
        run: |
          cd /tmp
          python - <<'PY'
          import hpfa.modules.core.csv_surface_reader_lite.src.csv_surface_reader
          import hpfa.modules.core.active_match_spine_runner.src.full_spine_runner
          print("hpfa_package_import=PASS")
          PY
      - name: Run repository hygiene contract
        run: python -m pytest -q tests/test_repository_hygiene.py
