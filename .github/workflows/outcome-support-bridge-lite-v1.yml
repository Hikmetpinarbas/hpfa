name: Outcome Support Bridge Lite V1

on:
  pull_request:
    paths:
      - "docs/research/eventonly/outcome_support_bridge_research_trace_v1.md"
      - "outcome_support_bridge_lite.py"
      - "hpfa/modules/core/outcome_support_bridge_lite/**"
      - "tools/bootstrap_termux_outcome_support_bridge_v1.sh"
      - "tools/run_active_match_outcome_support_bridge_v1.sh"
      - ".github/workflows/outcome-support-bridge-lite-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact PR head gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile implementation
        run: |
          python -m py_compile \
            outcome_support_bridge_lite.py \
            hpfa/modules/core/outcome_support_bridge_lite/src/outcome_support_bridge.py

      - name: Focused implementation tests
        run: python -m pytest -q hpfa/modules/core/outcome_support_bridge_lite/tests

      - name: Validate contract and fixed boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("hpfa/modules/core/outcome_support_bridge_lite/contract/outcome_support_bridge_lite_v1.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["module_id"] == "outcome_support_bridge_lite_v1"
          assert payload["version"] == "1.0.3"
          assert payload["status"] == "SMOKE_PASS"
          assert payload["runtime_evidence_status"] == "NOT_EVALUATED"
          assert payload["release_status"] == "NOT_PRODUCTION"
          assert payload["metric_rate_output_allowed"] is False
          assert payload["canonical_event_count"] == "UNKNOWN"
          assert payload["production_release"] is False
          assert all(value is False for value in payload["claim_boundary"].values())
          for source in ("selected_action", "selected_event", "sequence_consequence"):
              assert "match_surface_binding_id" in payload["input_contract"][source]["required_payload_fields"]
          assert payload["payload_binding_gate"]["required_before_sequence_index_build"] is True
          assert payload["payload_binding_gate"]["required_before_record_promotion"] is True
          assert payload["payload_binding_gate"]["failure_record_conflict"] == "payload_binding_gate_failed"
          assert any("not silently dropped" in item for item in payload["atom_support_integrity"])
          assert any("TERMINAL_OUTCOME_ATOM" in item for item in payload["atom_support_integrity"])
          assert any("DERIVED_CONSEQUENCE_ATOM" in item for item in payload["atom_support_integrity"])
          sequence_rule = next(rule for rule in payload["admission_rules"] if rule["id"] == "OSB04")
          assert sequence_rule["downstream_promotion_allowed"] is False
          PY

      - name: Shell syntax, phone guard and runtime input contract
        run: |
          set -euo pipefail
          bash -n tools/bootstrap_termux_outcome_support_bridge_v1.sh
          bash -n tools/run_active_match_outcome_support_bridge_v1.sh
          grep -F 'BRANCH="agent/outcome-support-bridge-lite-v1"' tools/bootstrap_termux_outcome_support_bridge_v1.sh
          grep -F 'run_active_match_event_label_structural_progression_evidence_v1.sh' tools/bootstrap_termux_outcome_support_bridge_v1.sh
          grep -F 'run_active_match_outcome_support_bridge_v1.sh' tools/bootstrap_termux_outcome_support_bridge_v1.sh
          grep -F 'nested_phone_output_directory_rejected' tools/run_active_match_outcome_support_bridge_v1.sh
          grep -F 'local path="$OUT/$name"' tools/run_active_match_outcome_support_bridge_v1.sh
          ! grep -F 'find "$ACTIVE"' tools/run_active_match_outcome_support_bridge_v1.sh
          grep -F 'canonical_event_count=UNKNOWN' tools/run_active_match_outcome_support_bridge_v1.sh
          grep -F 'production_release=false' tools/run_active_match_outcome_support_bridge_v1.sh

          bad="$RUNNER_TEMP/HPFA/nested"
          rm -rf "$RUNNER_TEMP/HPFA"
          set +e
          output="$(HPFA_PHONE_OUTPUT="$bad" bash tools/run_active_match_outcome_support_bridge_v1.sh 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -F 'nested_phone_output_directory_rejected' <<<"$output"
          test ! -e "$bad"

          python - <<'PY'
          from pathlib import Path
          text = Path("tools/run_active_match_outcome_support_bridge_v1.sh").read_text(encoding="utf-8")
          assert text.index('case "$OUT"') < text.index('STATE="$OUT/outcome_support_bridge_operator_state_v1.txt"')
          assert 'SELECTED_ACTION="$(resolve_input selected_action_consequence_surface_lite_v1.json)"' in text
          assert 'SELECTED_EVENT="$(resolve_input selected_event_consequence_surface_lite_v1.json)"' in text
          assert 'SEQUENCE="$(resolve_input eventonly_sequence_consequence_result_v1.json)"' in text
          PY

      - name: Source fail-closed invariants
        run: |
          set -euo pipefail
          source=hpfa/modules/core/outcome_support_bridge_lite/src/outcome_support_bridge.py
          grep -F 'if not binding_gate_pass:' "$source"
          grep -F 'record_conflicts.append("payload_binding_gate_failed")' "$source"
          grep -F 'supporting_evidence_atom_id_invalid' "$source"
          grep -F 'payload_binding_gate_pass' "$source"

      - name: Research trace and authority boundaries
        run: |
          set -euo pipefail
          trace=docs/research/eventonly/outcome_support_bridge_research_trace_v1.md
          grep -F 'ADAPT_NOT_COPY' "$trace"
          grep -F 'REFERENCE_ONLY' "$trace"
          grep -F 'DONOR_SUPPORT' "$trace"
          grep -F 'ACTIVE_MATCH_AUTHORITY' "$trace"
          grep -F 'missing lineage must fail closed' "$trace"
          grep -F 'terminal ownership ambiguity must block promotion' "$trace"
          grep -F 'sequence index' "$trace"
          grep -F 'invalid evidence-atom IDs' "$trace"
          grep -F 'canonical_event_count=UNKNOWN' "$trace"
          grep -F 'production_release=false' "$trace"

      - name: No sample match identity leak
        run: |
          ! grep -RInE "Australia|Turkey|World Cup|Juventus|Galatasaray|Fenerbahce|Sturm Graz|6935|77798" \
            docs/research/eventonly/outcome_support_bridge_research_trace_v1.md \
            outcome_support_bridge_lite.py \
            hpfa/modules/core/outcome_support_bridge_lite \
            tools/bootstrap_termux_outcome_support_bridge_v1.sh \
            tools/run_active_match_outcome_support_bridge_v1.sh

      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }} ${{ github.event.pull_request.head.sha || github.sha }}
