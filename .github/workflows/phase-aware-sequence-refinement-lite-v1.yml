name: Phase-Aware Sequence Refinement Lite V1

on:
  pull_request:
    paths:
      - "phase_aware_sequence_refinement_lite.py"
      - "hpfa/modules/core/phase_aware_sequence_refinement_lite/**"
      - "docs/contracts/phase_aware_sequence_refinement_lite_v1.md"
      - ".github/workflows/phase-aware-sequence-refinement-lite-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Exact PR head gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: >-
          python -m compileall -q
          phase_aware_sequence_refinement_lite.py
          hpfa/modules/core/phase_aware_sequence_refinement_lite
      - name: Focused tests
        run: >-
          python -m pytest -q
          hpfa/modules/core/phase_aware_sequence_refinement_lite/tests
      - name: Upstream phase compatibility
        run: >-
          python -m pytest -q
          hpfa/modules/core/event_derived_phase_state_lite/tests
      - name: Contract JSON
        run: >-
          python -m json.tool
          hpfa/modules/core/phase_aware_sequence_refinement_lite/contract/phase_aware_sequence_refinement_lite_v1.json
          >/dev/null
      - name: No sample match identity leak
        run: |
          ! grep -RInE "Australia|Turkey|World Cup|Juventus|Galatasaray|6935|77798" \
            phase_aware_sequence_refinement_lite.py \
            hpfa/modules/core/phase_aware_sequence_refinement_lite/src \
            docs/contracts/phase_aware_sequence_refinement_lite_v1.md
