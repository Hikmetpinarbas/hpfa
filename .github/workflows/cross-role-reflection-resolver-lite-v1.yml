name: Cross Role Reflection Resolver Lite V1

on:
  pull_request:
    paths:
      - 'hpfa/modules/core/cross_role_reflection_resolver_lite/**'
      - '.github/workflows/cross-role-reflection-resolver-lite-v1.yml'
  push:
    branches:
      - base-event-label-main-rule-match-test-v1

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/cross_role_reflection_resolver_lite/src/cross_role_reflection_resolver.py \
            hpfa/modules/core/cross_role_reflection_resolver_lite/tests/test_cross_role_reflection_resolver.py
      - name: Focused tests
        run: pytest -q hpfa/modules/core/cross_role_reflection_resolver_lite/tests/test_cross_role_reflection_resolver.py
