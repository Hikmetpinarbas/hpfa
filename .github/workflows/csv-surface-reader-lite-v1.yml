name: CSV Surface Reader Lite V1

on:
  pull_request:
    paths:
      - 'hpfa/modules/core/csv_surface_reader_lite/**'
      - 'csv_surface_reader_lite.py'
      - 'tools/run_active_match_csv_surface_reader_v1.sh'
      - 'tools/bootstrap_termux_csv_surface_reader_v1.sh'
      - '.github/workflows/csv-surface-reader-lite-v1.yml'
  workflow_dispatch:

concurrency:
  group: csv-surface-reader-lite-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile hpfa/modules/core/csv_surface_reader_lite/src/csv_surface_reader.py csv_surface_reader_lite.py
      - name: Focused tests
        run: python -m pytest -q hpfa/modules/core/csv_surface_reader_lite/tests
      - name: Shell syntax
        run: bash -n tools/run_active_match_csv_surface_reader_v1.sh tools/bootstrap_termux_csv_surface_reader_v1.sh
      - name: Claim boundary
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          source = Path("hpfa/modules/core/csv_surface_reader_lite/src/csv_surface_reader.py")
          spec = importlib.util.spec_from_file_location("csv_surface_reader_claim_check", source)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert module.CANONICAL_EVENT_COUNT == "UNKNOWN"
          assert module.CLAIM_CEILING == "CSV_SURFACE_AUDIT_ONLY"

          contract = json.loads(
              Path("hpfa/modules/core/csv_surface_reader_lite/contract/csv_surface_reader_lite_v1.json")
              .read_text(encoding="utf-8")
          )
          boundary = contract["claim_boundary"]
          assert boundary["canonical_event_count"] == "UNKNOWN"
          assert boundary["validated_team_identity"] is False
          assert boundary["validated_player_identity"] is False
          assert boundary["tactical_truth"] is False
          assert boundary["production_release"] is False
          PY
      - name: No sample identity leak
        run: python -m pytest -q hpfa/modules/core/csv_surface_reader_lite/tests/test_csv_surface_reader.py::test_no_sample_match_identity_leak
