name: CSV Surface Reader Lite V1

on:
  pull_request:
    paths:
      - 'hpfa/modules/core/csv_surface_reader_lite/**'
      - 'csv_surface_reader_lite.py'
      - 'tools/run_active_match_csv_surface_reader_v1.sh'
      - 'tools/bootstrap_termux_csv_surface_reader_v1.sh'
      - '.github/workflows/csv-surface-reader-lite-v1.yml'
  workflow_dispatch:

concurrency:
  group: csv-surface-reader-lite-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile hpfa/modules/core/csv_surface_reader_lite/src/csv_surface_reader.py csv_surface_reader_lite.py
      - name: Focused tests
        run: python -m pytest -q hpfa/modules/core/csv_surface_reader_lite/tests
      - name: Shell syntax
        run: bash -n tools/run_active_match_csv_surface_reader_v1.sh tools/bootstrap_termux_csv_surface_reader_v1.sh
      - name: Integration execution identity guard
        run: |
          bash tools/run_active_match_csv_surface_reader_v1.sh --self-test-execution-identity-guard
          grep -q 'HPFA_EXPECTED_BRANCH' tools/run_active_match_csv_surface_reader_v1.sh
          grep -q 'HPFA_EXPECTED_HEAD' tools/run_active_match_csv_surface_reader_v1.sh
          grep -q 'HPFA_EXPECTED_BRANCH' tools/bootstrap_termux_csv_surface_reader_v1.sh
          grep -q 'HPFA_EXPECTED_HEAD' tools/bootstrap_termux_csv_surface_reader_v1.sh
          ! grep -F 'BRANCH="csv-surface-reader-lite-v1"' \
            tools/run_active_match_csv_surface_reader_v1.sh \
            tools/bootstrap_termux_csv_surface_reader_v1.sh
      - name: Historical final capability blob lineage
        run: |
          test "$(git hash-object csv_surface_reader_lite.py)" = "7b2d48d45618ffaed9e9e73a10e648fb2956eb66"
          test "$(git hash-object hpfa/modules/core/csv_surface_reader_lite/contract/csv_surface_reader_lite_v1.json)" = "6a90613761ae04ef8fc36b46c738fd7a62a18708"
          test "$(git hash-object hpfa/modules/core/csv_surface_reader_lite/src/csv_surface_reader.py)" = "2c4938e456a5e95d65b1ec1eb78807a01558aee1"
          test "$(git hash-object hpfa/modules/core/csv_surface_reader_lite/tests/test_csv_surface_reader.py)" = "b4a205d09b88a36aaffb08bcdfc88f1ee6ac6149"
          test "$(git hash-object hpfa/modules/core/csv_surface_reader_lite/tests/test_csv_surface_reader_regressions.py)" = "c734d74f8e62a836d35e57a730e8c352839588ba"
          test "$(git hash-object hpfa/modules/core/csv_surface_reader_lite/tests/test_csv_surface_reader_team_binding.py)" = "3d8db44cbe0615c2b376fd82943d30cf2708aa92"
      - name: Claim boundary
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          source = Path("hpfa/modules/core/csv_surface_reader_lite/src/csv_surface_reader.py")
          spec = importlib.util.spec_from_file_location("csv_surface_reader_claim_check", source)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert module.CANONICAL_EVENT_COUNT == "UNKNOWN"
          assert module.CLAIM_CEILING == "CSV_SURFACE_AUDIT_ONLY"

          contract = json.loads(
              Path("hpfa/modules/core/csv_surface_reader_lite/contract/csv_surface_reader_lite_v1.json")
              .read_text(encoding="utf-8")
          )
          boundary = contract["claim_boundary"]
          assert boundary["canonical_event_count"] == "UNKNOWN"
          assert boundary["validated_team_identity"] is False
          assert boundary["validated_player_identity"] is False
          assert boundary["tactical_truth"] is False
          assert boundary["production_release"] is False
          PY
      - name: No sample identity leak
        run: python -m pytest -q hpfa/modules/core/csv_surface_reader_lite/tests/test_csv_surface_reader.py::test_no_sample_match_identity_leak
