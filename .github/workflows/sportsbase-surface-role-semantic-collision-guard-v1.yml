name: SportsBase Surface-Role Semantic Collision Guard V1

on:
  pull_request:
    paths:
      - 'hpfa/modules/core/provider_label_value_semantics_lite/**'
      - 'hpfa/modules/core/evidence_atom_inventory_lite/**'
      - 'hpfa/modules/core/semantic_role_action_bundle_candidates_lite/**'
      - 'tools/tests/test_sportsbase_surface_role_semantic_collision_guard_v1.py'
      - 'docs/research/eventonly/sportsbase_surface_role_semantic_collision_guard_v1.md'
      - '.github/workflows/sportsbase-surface-role-semantic-collision-guard-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact PR head gate
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/provider_label_value_semantics_lite/src/provider_label_value_semantics.py \
            hpfa/modules/core/evidence_atom_inventory_lite/src/evidence_atom_inventory.py \
            hpfa/modules/core/semantic_role_action_bundle_candidates_lite/src/semantic_role_action_bundle_candidates.py \
            tools/tests/test_sportsbase_surface_role_semantic_collision_guard_v1.py

      - name: Focused tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/provider_label_value_semantics_lite/tests/test_provider_label_value_semantics.py \
            hpfa/modules/core/provider_label_value_semantics_lite/tests/test_provider_label_value_semantics_registry_safety.py \
            hpfa/modules/core/evidence_atom_inventory_lite/tests/test_evidence_atom_inventory.py \
            hpfa/modules/core/evidence_atom_inventory_lite/tests/test_evidence_atom_role_families.py \
            tools/tests/test_sportsbase_surface_role_semantic_collision_guard_v1.py
