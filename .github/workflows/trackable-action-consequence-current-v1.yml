name: Trackable Action Consequence Current V1

on:
  pull_request:
    branches:
      - work/reconstruct-trackable-action-trace-current-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trackable-action-consequence-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Exact head gate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Compile current consequence migration
        run: |
          python -m py_compile \
            trackable_action_consequence_candidates_current_v1.py \
            trackable_action_trace_candidates_current_v1.py \
            hpfa/modules/core/trackable_action_consequence_candidates_lite/src/trackable_action_consequence_candidates.py

      - name: Focused current consequence tests
        run: python -m pytest -q hpfa/modules/core/trackable_action_consequence_candidates_lite/tests/test_current_contract_migration.py

      - name: Current Trackable Action compatibility tests
        run: python -m pytest -q hpfa/modules/core/trackable_action_trace_candidates_lite/tests/test_current_contract_migration.py

      - name: Current Cross-Role Relation compatibility tests
        run: python -m pytest -q hpfa/modules/core/cross_role_relation_candidate_resolver_lite/tests/test_current_contract_migration.py

      - name: Current Multi-Family Taxonomy compatibility tests
        run: python -m pytest -q hpfa/modules/core/action_bundle_multi_family_review_taxonomy_lite/tests/test_current_contract_migration.py

      - name: Current Semantic Action Bundle compatibility tests
        run: python -m pytest -q hpfa/modules/core/semantic_role_action_bundle_candidates_lite/tests/test_current_contract_migration.py

      - name: Current Match-Local Identity compatibility tests
        run: python -m pytest -q hpfa/modules/core/match_local_identity_candidates_lite/tests/test_current_evidence_atom_migration.py

      - name: Current Evidence Atom compatibility tests
        run: python -m pytest -q hpfa/modules/core/evidence_atom_inventory_lite/tests/test_current_row_nucleus_migration.py

      - name: Current Row Nucleus compatibility tests
        run: |
          python -m pytest -q \
            hpfa/modules/core/row_nucleus_inventory_lite/tests/test_content_role_bridge.py \
            hpfa/modules/core/row_nucleus_inventory_lite/tests/test_row_nucleus_inventory.py

      - name: Contract JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('hpfa/modules/core/trackable_action_consequence_candidates_lite/contract/trackable_action_consequence_candidates_lite_v1.json').read_text(encoding='utf-8'))
          assert p['module_id'] == 'trackable_action_consequence_candidates_lite_v1'
          assert p['timeline_rules']['same_timestamp_link_allowed'] is False
          assert p['timeline_rules']['negative_time_link_allowed'] is False
          assert p['timeline_rules']['cross_period_link_allowed'] is False
          assert p['timeline_rules']['source_row_order_is_temporal_truth'] is False
          assert p['timeline_rules']['window_seconds'] == [5.0, 8.0, 12.0]
          assert p['timeline_rules']['max_follow_up_time_layers'] == 3
          assert p['claim_boundary']['window_is_sequence_truth'] is False
          assert p['claim_boundary']['canonical_event_count'] == 'UNKNOWN'
          assert p['claim_boundary']['true_action_count'] == 'UNKNOWN'
          assert p['claim_boundary']['production_release'] is False
          PY

      - name: Termux bootstrap syntax
        run: bash -n tools/bootstrap_termux_trackable_action_consequence_current_v1.sh

      - name: Claim and match-agnostic guards
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('trackable_action_consequence_candidates_current_v1.py'),
              Path('hpfa/modules/core/trackable_action_consequence_candidates_lite/src/trackable_action_consequence_candidates.py'),
              Path('tools/bootstrap_termux_trackable_action_consequence_current_v1.sh'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in paths)
          for token in ('Genclerbirligi', 'Fenerbahce', '15.08.2026', 'Galatasaray'):
              assert token not in text, token
          for required in ('canonical_event_count', 'true_action_count', 'same_time_link_allowed', 'window_is_sequence_truth'):
              assert required in text
          PY

      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }}..HEAD
