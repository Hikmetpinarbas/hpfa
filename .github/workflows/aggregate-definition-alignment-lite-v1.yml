name: Aggregate Definition Alignment Lite V1

on:
  pull_request:
    paths:
      - "aggregate_definition_alignment_lite.py"
      - "hpfa/modules/core/aggregate_definition_alignment_lite/**"
      - "docs/contracts/aggregate_definition_alignment_lite_v1.md"
      - "tools/run_active_match_aggregate_definition_alignment_v1.sh"
      - "tools/bootstrap_termux_aggregate_definition_alignment_v1.sh"
      - ".github/workflows/aggregate-definition-alignment-lite-v1.yml"
  workflow_dispatch:

concurrency:
  group: aggregate-definition-alignment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Exact PR head gate
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          echo "exact_head_sha=$actual_head"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m compileall -q aggregate_definition_alignment_lite.py hpfa/modules/core/aggregate_definition_alignment_lite
      - run: python -m pytest -q hpfa/modules/core/aggregate_definition_alignment_lite/tests
      - run: bash -n tools/run_active_match_aggregate_definition_alignment_v1.sh tools/bootstrap_termux_aggregate_definition_alignment_v1.sh
