name: Aggregate Event Reconciliation Gate Lite V1

on:
  pull_request:
    paths:
      - 'hpfa/modules/core/aggregate_event_reconciliation_gate_lite/**'
      - '.github/workflows/aggregate-event-reconciliation-gate-lite-v1.yml'
  push:
    branches:
      - base-event-label-main-rule-match-test-v1

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/aggregate_event_reconciliation_gate_lite/src/aggregate_event_reconciliation_gate.py \
            hpfa/modules/core/aggregate_event_reconciliation_gate_lite/tests/test_aggregate_event_reconciliation_gate.py
      - name: Focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -vv --tb=short hpfa/modules/core/aggregate_event_reconciliation_gate_lite/tests/test_aggregate_event_reconciliation_gate.py
