name: Match-Local Actor Team Identity Decoder Lite V1

on:
  push:
    branches:
      - match-local-actor-team-identity-decoder-lite-v1
  pull_request:
    paths:
      - "match_local_actor_team_identity_decoder.py"
      - "hpfa/modules/core/match_local_actor_team_identity_decoder_lite/**"
      - ".github/workflows/match-local-actor-team-identity-decoder-lite-v1.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/match_local_actor_team_identity_decoder_lite/src/match_local_actor_team_identity_decoder.py \
            hpfa/modules/core/match_local_actor_team_identity_decoder_lite/tests/test_match_local_actor_team_identity_decoder.py \
            match_local_actor_team_identity_decoder.py
      - name: Focused acceptance tests
        run: pytest -q hpfa/modules/core/match_local_actor_team_identity_decoder_lite/tests/test_match_local_actor_team_identity_decoder.py
      - name: Product-code identity leak guard
        run: |
          ! grep -Eini "Australia|Turkey|Irankunda|Calhanoglu|Demiral" \
            hpfa/modules/core/match_local_actor_team_identity_decoder_lite/src/match_local_actor_team_identity_decoder.py \
            match_local_actor_team_identity_decoder.py
