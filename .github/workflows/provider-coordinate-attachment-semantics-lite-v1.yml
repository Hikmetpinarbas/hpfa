name: Provider Coordinate Attachment Semantics Lite V1

on:
  pull_request:
    paths:
      - "provider_coordinate_attachment_semantics_lite.py"
      - "hpfa/modules/core/provider_coordinate_attachment_semantics_lite/**"
      - "docs/contracts/provider_coordinate_attachment_semantics_lite_v1.md"
      - "tools/run_active_match_provider_coordinate_attachment_semantics_v1.sh"
      - ".github/workflows/provider-coordinate-attachment-semantics-lite-v1.yml"
  workflow_dispatch:

concurrency:
  group: provider-coordinate-attachment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact PR head gate
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade pytest

      - name: Compile
        run: |
          python -m py_compile \
            hpfa/modules/core/provider_coordinate_attachment_semantics_lite/src/provider_coordinate_attachment_semantics.py \
            hpfa/modules/core/provider_coordinate_attachment_semantics_lite/tests/test_provider_coordinate_attachment_semantics.py \
            provider_coordinate_attachment_semantics_lite.py

      - name: Focused tests
        run: python -m pytest -q hpfa/modules/core/provider_coordinate_attachment_semantics_lite/tests

      - name: Contract JSON
        run: python -m json.tool hpfa/modules/core/provider_coordinate_attachment_semantics_lite/contract/provider_coordinate_attachment_semantics_lite_v1.json >/dev/null

      - name: Termux runner shell syntax
        run: bash -n tools/run_active_match_provider_coordinate_attachment_semantics_v1.sh
