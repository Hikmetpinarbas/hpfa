name: Process Professional Finding Bridge V1

on:
  pull_request:
    paths:
      - 'reciprocal_process_chain_current_v1.py'
      - 'hpfa/modules/core/match_reconciliation_ledger_lite/**'
      - 'hpfa/modules/core/team_episode_activity_lens_lite/**'
      - 'hpfa/modules/core/visible_geometry_lens_lite/**'
      - 'hpfa/modules/core/player_aggregate_process_reconciliation_lite/**'
      - 'hpfa/modules/core/process_robustness_lens_lite/**'
      - 'hpfa/modules/core/process_metric_profile_lite/**'
      - 'hpfa/modules/core/professional_finding_candidate_lite/**'
      - 'hpfa/modules/core/analyst_report_block_composer_lite/**'
      - '.github/workflows/process-professional-finding-bridge-v1.yml'
  push:
    branches:
      - 'feature/process-professional-finding-bridge-v1'
      - 'feature/sequence-pattern-admission-v1'
      - 'feature/safe-finding-sequence-binding-v1'

jobs:
  professional-finding-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run bridge regressions
        run: |
          python -m pytest -q \
            hpfa/modules/core/match_reconciliation_ledger_lite/tests/test_match_reconciliation_ledger_v2.py \
            hpfa/modules/core/team_episode_activity_lens_lite/tests/test_team_episode_activity_lens.py \
            hpfa/modules/core/visible_geometry_lens_lite/tests/test_visible_geometry_lens.py \
            hpfa/modules/core/player_aggregate_process_reconciliation_lite/tests/test_player_aggregate_process_reconciliation.py \
            hpfa/modules/core/process_robustness_lens_lite/tests/test_process_robustness_lens.py \
            hpfa/modules/core/process_metric_profile_lite/tests/test_process_metric_profile.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_professional_finding_candidate.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_visible_episode_context_contrast.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_threshold_sensitivity.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_failed_trace_support.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_alternative_explanation.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_duplicate_reflection_risk.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_context_period_deconfound.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_professional_finding_bundle_ledger.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_sequence_pattern_admission.py \
            hpfa/modules/core/professional_finding_candidate_lite/tests/test_sequence_safe_finding_binding.py \
            hpfa/modules/core/analyst_report_block_composer_lite/tests/test_sequence_finding_report_projection.py
      - name: Compile current runtime and bridge modules
        run: |
          python -m py_compile reciprocal_process_chain_current_v1.py
          python -m py_compile hpfa/modules/core/match_reconciliation_ledger_lite/src/match_reconciliation_ledger.py
          python -m py_compile hpfa/modules/core/team_episode_activity_lens_lite/src/team_episode_activity_lens.py
          python -m py_compile hpfa/modules/core/visible_geometry_lens_lite/src/visible_geometry_lens.py
          python -m py_compile hpfa/modules/core/player_aggregate_process_reconciliation_lite/src/player_aggregate_process_reconciliation.py
          python -m py_compile hpfa/modules/core/process_robustness_lens_lite/src/process_robustness_lens.py
          python -m py_compile hpfa/modules/core/process_metric_profile_lite/src/process_metric_profile.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/professional_finding_candidate.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/threshold_sensitivity.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/failed_trace_support.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/alternative_explanation.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/duplicate_reflection_risk.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/visible_episode_context_contrast.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/sequence_pattern_admission.py
          python -m py_compile hpfa/modules/core/professional_finding_candidate_lite/src/sequence_safe_finding_binding.py
          python -m py_compile hpfa/modules/core/analyst_report_block_composer_lite/src/sequence_finding_report_projection.py
      - name: Claim and accounting lock audit
        run: |
          grep -F 'process_membership_share_uses_matching_unique_process_units' hpfa/modules/core/match_reconciliation_ledger_lite/src/match_reconciliation_ledger.py
          grep -F 'REVIEWED_PROVIDER_SEMANTICS' hpfa/modules/core/team_episode_activity_lens_lite/src/team_episode_activity_lens.py
          grep -F 'activity_signals_are_true_phases' hpfa/modules/core/team_episode_activity_lens_lite/src/team_episode_activity_lens.py
          grep -F 'direction_normalized' hpfa/modules/core/visible_geometry_lens_lite/src/visible_geometry_lens.py
          grep -F 'xlsx_creates_player_identity' hpfa/modules/core/player_aggregate_process_reconciliation_lite/src/player_aggregate_process_reconciliation.py
          grep -F 'aggregate_metric_truth' hpfa/modules/core/player_aggregate_process_reconciliation_lite/src/player_aggregate_process_reconciliation.py
          grep -F 'recurrence_surface_robustness_is_pattern_truth' hpfa/modules/core/process_robustness_lens_lite/src/process_robustness_lens.py
          grep -F 'composite_metrics_are_calibrated' hpfa/modules/core/process_metric_profile_lite/src/process_metric_profile.py
          grep -F 'claim_output_allowed' hpfa/modules/core/professional_finding_candidate_lite/src/professional_finding_candidate.py
          grep -F 'professional_finding_emitted' hpfa/modules/core/professional_finding_candidate_lite/src/professional_finding_candidate.py
          grep -F 'thresholds_are_calibrated' hpfa/modules/core/professional_finding_candidate_lite/src/threshold_sensitivity.py
          grep -F 'missing_trace_is_failed_football_action' hpfa/modules/core/professional_finding_candidate_lite/src/failed_trace_support.py
          grep -F 'missing_trace_is_counterevidence' hpfa/modules/core/professional_finding_candidate_lite/src/failed_trace_support.py
          grep -F 'alternative_explanation_is_causal_truth' hpfa/modules/core/professional_finding_candidate_lite/src/alternative_explanation.py
          grep -F 'absence_of_visible_alternative_proves_primary_explanation' hpfa/modules/core/professional_finding_candidate_lite/src/alternative_explanation.py
          grep -F 'alternative_explanation_search_complete_for_final_finding' hpfa/modules/core/professional_finding_candidate_lite/src/alternative_explanation.py
          grep -F 'raw_atom_count_is_independent_evidence_count' hpfa/modules/core/professional_finding_candidate_lite/src/duplicate_reflection_risk.py
          grep -F 'csv_xml_reflections_are_independent_votes' hpfa/modules/core/professional_finding_candidate_lite/src/duplicate_reflection_risk.py
          grep -F 'absence_of_duplicate_membership_proves_independence' hpfa/modules/core/professional_finding_candidate_lite/src/duplicate_reflection_risk.py
          grep -F 'period_reported_but_not_used_as_activity_fingerprint' hpfa/modules/core/professional_finding_candidate_lite/src/visible_episode_context_contrast.py
          grep -F 'context_difference_is_causal_explanation' hpfa/modules/core/professional_finding_candidate_lite/src/visible_episode_context_contrast.py
          grep -F 'absence_of_visible_context_difference_disproves_context_dependence' hpfa/modules/core/professional_finding_candidate_lite/src/visible_episode_context_contrast.py
          grep -F 'independent_support_inferred_from_nominal_count' hpfa/modules/core/professional_finding_candidate_lite/src/sequence_pattern_admission.py
          grep -F 'tactical_pattern_state_allowed' hpfa/modules/core/professional_finding_candidate_lite/src/sequence_pattern_admission.py
          grep -F 'professional_finding_emitted_count' hpfa/modules/core/professional_finding_candidate_lite/src/sequence_safe_finding_binding.py
          grep -F 'production_report_allowed' hpfa/modules/core/analyst_report_block_composer_lite/src/sequence_finding_report_projection.py
          grep -F 'production_release=false' hpfa/modules/core/professional_finding_candidate_lite/src/professional_finding_candidate.py
