name: Intelligence E2E Contract Fixture V1

on:
  pull_request:
    branches:
      - fix/intelligence-signal-metadata-lineage-v1
    paths:
      - 'hpfa/tests/integration/test_intelligence_chain_contract_v1.py'
      - 'hpfa/modules/core/composite_evidence_packet_builder_lite/**'
      - 'hpfa/modules/core/multi_signal_evidence_fusion_lite/**'
      - 'hpfa/modules/core/composite_argument_builder_lite/**'
      - 'hpfa/modules/core/defeasible_argument_router_lite/**'
      - 'hpfa/modules/core/evidence_graph_engine_lite/**'
      - 'hpfa/modules/core/evidence_lens_matrix_lite/**'
      - 'hpfa/modules/core/safe_argument_router_tr_lite/**'
      - 'hpfa/modules/core/analyst_report_block_composer_lite/**'
      - 'hpfa/modules/core/report_output_contract_lite/**'
      - 'hpfa/modules/core/final_report_assembly_gate_lite/**'
      - '.github/workflows/intelligence-e2e-contract-fixture-v1.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile end-to-end fixture and canonical producers
        run: |
          python -m py_compile hpfa/tests/integration/test_intelligence_chain_contract_v1.py
          python -m py_compile hpfa/modules/core/composite_evidence_packet_builder_lite/src/composite_evidence_packet_builder.py
          python -m py_compile hpfa/modules/core/multi_signal_evidence_fusion_lite/src/multi_signal_evidence_fusion.py
          python -m py_compile hpfa/modules/core/composite_argument_builder_lite/src/composite_argument_builder.py
          python -m py_compile hpfa/modules/core/defeasible_argument_router_lite/src/defeasible_argument_router.py
          python -m py_compile hpfa/modules/core/evidence_graph_engine_lite/src/evidence_graph_engine.py
          python -m py_compile hpfa/modules/core/evidence_lens_matrix_lite/src/evidence_lens_matrix.py
          python -m py_compile hpfa/modules/core/safe_argument_router_tr_lite/src/safe_argument_router_tr.py
          python -m py_compile hpfa/modules/core/analyst_report_block_composer_lite/src/analyst_report_block_composer.py
          python -m py_compile hpfa/modules/core/report_output_contract_lite/src/report_output_contract.py
          python -m py_compile hpfa/modules/core/final_report_assembly_gate_lite/src/final_report_assembly_gate.py

      - name: Run canonical module regressions
        run: |
          python -m pytest -q hpfa/modules/core/composite_evidence_packet_builder_lite/tests/test_composite_evidence_packet_builder.py
          python -m pytest -q hpfa/modules/core/multi_signal_evidence_fusion_lite/tests/test_multi_signal_evidence_fusion.py
          python -m pytest -q hpfa/modules/core/multi_signal_evidence_fusion_lite/tests/test_packet_signal_metadata_lineage_v1.py
          python -m pytest -q hpfa/modules/core/composite_argument_builder_lite/tests/test_composite_argument_builder.py
          python -m pytest -q hpfa/modules/core/defeasible_argument_router_lite/tests/test_defeasible_argument_router.py hpfa/modules/core/defeasible_argument_router_lite/tests/test_defeasible_recursive_forbidden_guard_v1.py
          python -m pytest -q hpfa/modules/core/evidence_graph_engine_lite/tests/test_evidence_graph_engine.py
          python -m pytest -q hpfa/modules/core/evidence_lens_matrix_lite/tests/test_evidence_lens_matrix.py
          python -m pytest -q hpfa/modules/core/safe_argument_router_tr_lite/tests/test_safe_argument_router_tr.py
          python -m pytest -q hpfa/modules/core/analyst_report_block_composer_lite/tests/test_analyst_report_block_composer.py
          python -m pytest -q hpfa/modules/core/report_output_contract_lite/tests/test_report_output_contract.py
          python -m pytest -q hpfa/modules/core/final_report_assembly_gate_lite/tests/test_final_report_assembly_gate.py hpfa/modules/core/final_report_assembly_gate_lite/tests/test_final_assembly_recursive_forbidden_guard_v1.py

      - name: Run end-to-end producer-consumer fixture
        run: python -m pytest -q hpfa/tests/integration/test_intelligence_chain_contract_v1.py

      - name: Contract and claim invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          test = Path('hpfa/tests/integration/test_intelligence_chain_contract_v1.py').read_text(encoding='utf-8')
          required = [
              'test_intelligence_chain_standard_fields_connect',
              'test_intelligence_chain_explicit_counterevidence_remains_review_bounded',
              'test_intelligence_chain_upstream_failure_propagates',
              'test_intelligence_chain_nested_forbidden_field_fails_closed',
              'test_intelligence_chain_canonical_event_count_stays_unknown',
              'test_intelligence_chain_no_sample_match_identity_leak',
          ]
          for name in required:
              assert name in test
          assert 'ROUTE_ASSEMBLY_ITEM_TO_REVIEW' in test
          assert 'MIXED_WITH_EXPLICIT_CONTRADICTION' in test
          assert 'canonical_event_count' in test
          PY
