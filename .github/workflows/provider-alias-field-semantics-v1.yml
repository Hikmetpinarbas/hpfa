name: Provider Alias Field Semantics Lite V1

on:
  pull_request:
    paths:
      - "provider_alias_field_semantics_lite.py"
      - "hpfa/modules/core/provider_alias_field_semantics_lite/**"
      - "tools/bootstrap_termux_provider_alias_field_semantics_v1.sh"
      - "tools/run_active_match_provider_alias_field_semantics_v1.sh"
      - ".github/workflows/provider-alias-field-semantics-v1.yml"
  workflow_dispatch:

concurrency:
  group: provider-alias-field-semantics-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest openpyxl
      - name: Compile
        run: |
          python -m py_compile \
            provider_alias_field_semantics_lite.py \
            hpfa/modules/core/provider_alias_field_semantics_lite/src/provider_alias_field_semantics.py \
            hpfa/modules/core/provider_alias_field_semantics_lite/tests/test_provider_alias_field_semantics.py
      - name: Focused tests
        run: python -m pytest -q hpfa/modules/core/provider_alias_field_semantics_lite/tests
      - name: Shell syntax
        run: bash -n tools/run_active_match_provider_alias_field_semantics_v1.sh tools/bootstrap_termux_provider_alias_field_semantics_v1.sh
      - name: Integration execution identity guard
        run: |
          bash tools/run_active_match_provider_alias_field_semantics_v1.sh --self-test-execution-identity-guard
          grep -q 'HPFA_EXPECTED_BRANCH' tools/run_active_match_provider_alias_field_semantics_v1.sh
          grep -q 'HPFA_EXPECTED_HEAD' tools/run_active_match_provider_alias_field_semantics_v1.sh
          ! grep -F 'reset --hard' tools/bootstrap_termux_provider_alias_field_semantics_v1.sh
      - name: Historical mapping implementation lineage
        run: |
          test "$(git hash-object provider_alias_field_semantics_lite.py)" = "49d7cff116dd46a29d94cee0549c608d6694622d"
          test "$(git hash-object hpfa/modules/core/provider_alias_field_semantics_lite/src/provider_alias_field_semantics.py)" = "65b915eb531a0943359c7351444354c54f7b5dd0"
      - name: Claim boundary and R08 temporal-order guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("hpfa/modules/core/provider_alias_field_semantics_lite/contract/provider_alias_field_semantics_lite_v1.json").read_text())
          b=c["claim_boundary"]; g=c["temporal_order_guard"]
          assert b["canonical_event_count"]=="UNKNOWN"
          assert b["validated_temporal_order"] is False
          assert b["source_row_order_truth"] is False
          assert b["sequence_truth"] is False
          assert b["production_release"] is False
          assert g["time_field_candidate_is_football_order_truth"] is False
          assert g["source_row_index_role"]=="PROVENANCE_ORDER_ONLY"
          assert g["same_time_default_without_admitted_order_evidence"]=="SAME_TIME_UNORDERED"
          assert g["event_type_priority_ordering_allowed"] is False
          assert g["same_time_means_simultaneous_truth"] is False
          assert g["downstream_order_sensitive_claim_decision"]=="REVIEW_REQUIRED"
          PY
      - name: No sample identity leak
        run: python -m pytest -q hpfa/modules/core/provider_alias_field_semantics_lite/tests/test_provider_alias_field_semantics.py::test_no_sample_match_identity_leak
