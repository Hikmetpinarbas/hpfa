name: Intelligence Safe Router Review Continuity V1

on:
  pull_request:
    branches:
      - fix/intelligence-canonical-defeasible-graph-route-v1
    paths:
      - 'hpfa/modules/core/evidence_graph_engine_lite/**'
      - 'hpfa/modules/core/safe_argument_router_tr_lite/**'
      - 'docs/contracts/evidence_graph_engine_lite_v1.md'
      - 'docs/contracts/safe_argument_router_tr_lite_v1.md'
      - '.github/workflows/intelligence-safe-router-review-continuity-v1.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile graph and Safe Router producers
        run: |
          python -m py_compile hpfa/modules/core/evidence_graph_engine_lite/src/evidence_graph_engine.py
          python -m py_compile hpfa/modules/core/safe_argument_router_tr_lite/src/safe_argument_router_tr.py
          python -m py_compile hpfa/modules/core/evidence_graph_engine_lite/tests/test_evidence_graph_engine.py
          python -m py_compile hpfa/modules/core/safe_argument_router_tr_lite/tests/test_safe_argument_router_tr.py

      - name: Run Graph and Safe Router regressions
        run: |
          python -m pytest -q hpfa/modules/core/evidence_graph_engine_lite/tests/test_evidence_graph_engine.py
          python -m pytest -q hpfa/modules/core/safe_argument_router_tr_lite/tests/test_safe_argument_router_tr.py

      - name: Review-debt continuity guards
        run: |
          python - <<'PY'
          from pathlib import Path

          graph = Path('hpfa/modules/core/evidence_graph_engine_lite/src/evidence_graph_engine.py').read_text(encoding='utf-8')
          safe = Path('hpfa/modules/core/safe_argument_router_tr_lite/src/safe_argument_router_tr.py').read_text(encoding='utf-8')
          contract = Path('docs/contracts/safe_argument_router_tr_lite_v1.md').read_text(encoding='utf-8')

          assert 'ROUTE_EVIDENCE_GRAPH_TO_REVIEW' in graph
          assert 'defeasible_argument_weakened' in graph
          assert 'defeasible_argument_withdrawn' in graph
          assert '_upstream_review_required' in safe
          assert 'ROUTE_REVIEW_SAFE_SENTENCE_CANDIDATE' in safe
          assert 'review_safe_sentence_count' in safe
          assert 'geri çekilmiş durumda' in safe
          assert 'zayıflamış durumda' in safe
          assert '_collect_forbidden_hits' in safe
          assert 'upstream REVIEW_REQUIRED     -> REVIEW_REQUIRED' in contract
          assert 'canonical_event_count' in graph
          assert 'canonical_event_count' in safe

          for token in ('Genclerbirligi', 'Fenerbahce', '15.08.2026'):
              assert token not in graph
              assert token not in safe
          PY
