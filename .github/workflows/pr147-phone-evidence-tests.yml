name: PR147 phone evidence tests

on:
  push:
    branches:
      - active-match-phone-evidence-runner-v1
  pull_request:
    paths:
      - active_match_phone_evidence_run.py
      - tests/test_active_match_phone_evidence_run.py
      - .github/workflows/pr147-phone-evidence-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-evidence-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile runner
        run: python -m py_compile active_match_phone_evidence_run.py tests/test_active_match_phone_evidence_run.py
      - name: Run phone evidence tests
        run: python -m pytest tests/test_active_match_phone_evidence_run.py -q
