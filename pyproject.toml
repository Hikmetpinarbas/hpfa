[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpfa"
version = "0.1.0"
description = "Claim-safe, match-agnostic football intelligence core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
hpfa-active-match = "active_match_spine_runner:main"

[project.optional-dependencies]
xls = ["xlrd>=2.0.2"]
reference = ["pypdf>=6.0"]
dev = ["pytest>=8.0", "openpyxl>=3.1"]
legacy-tools = [
  "numpy>=2.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "mplsoccer>=1.4",
]

[tool.setuptools]
include-package-data = true
py-modules = [
  "active_match_spine_runner",
  "active_match_full_run",
  "analyst_episode_locator",
  "axis_integrity_tagger",
  "boundary_analysis_scorer",
  "content_source_role_resolver",
  "context_action_semantics_rebind",
  "cross_format_reconciliation_lite",
  "csv_surface_reader_lite",
  "episode_feature_vector",
  "event_window_builder",
  "multiformat_file_inventory",
  "provider_alias_field_semantics_lite",
  "provider_label_value_semantics_lite",
  "row_nucleus_inventory",
  "time_scale_router",
  "triangulated_event_reflection_resolver",
  "xlsx_surface_reader_lite",
  "xml_surface_reader_lite",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hpfa*", "canon*"]
exclude = ["hpfa.tests*", "hpfa.modules.*.tests*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv", "*.tsv", "*.yaml", "*.yml", "*.txt", "*.md"]
